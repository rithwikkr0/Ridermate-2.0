name: ridermate
description: "RiderMate 2.0 â€” Premium Mobility Platform"
publish_to: 'none'

version: 2.0.0+51524378

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Fonts
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.6.3

  # Animations
  flutter_animate: ^4.5.2

  # Images & Camera
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # State (for theme toggle)
  provider: ^6.1.2

  # Persistent key-value storage
  shared_preferences: ^2.3.3

  # Device and offline runtime
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  geolocator: ^13.0.4
  permission_handler: ^11.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1
  sensors_plus: ^5.0.1
  battery_plus: ^6.0.2
  record: ^5.2.0
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  share_plus: ^10.1.4
  flutter_contacts: ^1.1.9+2

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.4+1

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ridermate_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF6B00"
  adaptive_icon_foreground: "assets/images/ridermate_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

