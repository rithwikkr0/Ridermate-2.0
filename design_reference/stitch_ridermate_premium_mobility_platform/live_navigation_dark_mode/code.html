<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Navigation - RiderMate</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-container": "#bab8b7",
                      "outline-variant": "#5a4136",
                      "on-error-container": "#ffdad6",
                      "secondary-container": "#4a4949",
                      "inverse-surface": "#e2e2e2",
                      "on-secondary-fixed-variant": "#474646",
                      "secondary": "#c8c6c5",
                      "on-primary-container": "#572000",
                      "inverse-primary": "#a04100",
                      "surface-container": "#1e2020",
                      "on-secondary": "#313030",
                      "primary-fixed": "#ffdbcc",
                      "on-surface-variant": "#e2bfb0",
                      "on-error": "#690005",
                      "on-tertiary-fixed-variant": "#474746",
                      "on-tertiary-container": "#313131",
                      "on-surface": "#e2e2e2",
                      "surface-bright": "#37393a",
                      "surface": "#121414",
                      "tertiary-fixed-dim": "#c8c6c5",
                      "on-primary-fixed": "#351000",
                      "on-primary": "#561f00",
                      "on-background": "#e2e2e2",
                      "primary-container": "#ff6b00",
                      "surface-container-low": "#1a1c1c",
                      "primary-fixed-dim": "#ffb693",
                      "tertiary-container": "#9a9999",
                      "on-primary-fixed-variant": "#7a3000",
                      "on-tertiary-fixed": "#1b1c1c",
                      "surface-tint": "#ffb693",
                      "surface-variant": "#333535",
                      "tertiary-fixed": "#e4e2e1",
                      "inverse-on-surface": "#2f3131",
                      "surface-container-highest": "#333535",
                      "secondary-fixed-dim": "#c8c6c5",
                      "tertiary": "#c8c6c5",
                      "error-container": "#93000a",
                      "primary": "#ffb693",
                      "error": "#ffb4ab",
                      "outline": "#a98a7d",
                      "background": "#121414",
                      "secondary-fixed": "#e5e2e1",
                      "on-secondary-fixed": "#1c1b1b",
                      "surface-dim": "#121414",
                      "surface-container-lowest": "#0c0f0f",
                      "surface-container-high": "#282a2b",
                      "on-tertiary": "#303030"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "md": "16px",
                      "margin-mobile": "20px",
                      "gutter": "16px",
                      "sm": "8px",
                      "xl": "32px",
                      "xs": "4px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "stat-label": [
                              "Inter"
                      ],
                      "display-stat": [
                              "Hanken Grotesk"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "stat-label": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-stat": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background overflow-hidden h-screen w-screen relative select-none">
<!-- Map Background Layer (Level 0) -->
<div class="absolute inset-0 z-0 bg-surface-container-lowest" data-alt="A top-down view of a winding alpine road shown on a high-end dark mode digital map. The map features deep black and charcoal terrain with subtle topographic lines. A vibrant, glowing neon orange route line highlights the winding path. The overall aesthetic is sleek, minimalist, and highly technical, resembling a modern GPS navigation system." data-location="Swiss Alps" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDljKOxuu3X_oXlunyYKWB8k8mcu83fwtLKH2mypO9Sw1NOgMrAKOU7UFPwdYeyIvwdhN4-r82pHMPgWyM6MzIbYNsXoR4JIVa7qt5ocOAXi7TBCvLuE3c5ju85vTfk7gRdSHu9LBKi_CFbQr2qI5gDKh36JtyR8oIlmUPAUZGF5wxGlE4sx1TVgO6UZ6U1tBxZDCFA1_rnQmQ-TlDqm10y4J2l_xFnoKvyne38OPfnLjclmnmEkqfVMA')">
<!-- Simulated Map Grid/Texture -->
<div class="absolute inset-0 opacity-5 bg-[linear-gradient(rgba(255,255,255,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.1)_1px,transparent_1px)] bg-[size:40px_40px]"></div>
</div>
<!-- UI Overlay Layer -->
<div class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none">
<!-- Top Section: Next Turn (Level 2 Floating) -->
<header class="pt-[env(safe-area-inset-top,40px)] px-margin-mobile flex justify-center w-full pointer-events-auto">
<div class="w-full max-w-md bg-surface/70 backdrop-blur-[24px] border border-white/10 rounded-[24px] shadow-[0_20px_40px_rgba(0,0,0,0.5),0_0_20px_rgba(255,107,0,0.1)] p-md flex items-center justify-between mt-sm">
<div class="flex items-center gap-md">
<!-- Turn Icon -->
<div class="w-14 h-14 rounded-full bg-primary-container/20 border border-primary/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-weight: 600;">turn_right</span>
</div>
<!-- Turn Details -->
<div class="flex flex-col">
<div class="flex items-baseline gap-xs">
<span class="font-display-stat text-[36px] leading-[40px] tracking-tight font-bold text-on-surface">300</span>
<span class="font-label-caps text-label-caps text-primary">M</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant truncate max-w-[180px]">Via San Bernardino</span>
</div>
</div>
<!-- Secondary Action (e.g. overview) -->
<button class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/10 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">route</span>
</button>
</div>
</header>
<!-- Middle Section: Floating Controls (Level 1) -->
<main class="flex-1 w-full px-margin-mobile flex items-end justify-end pb-lg pointer-events-auto">
<div class="flex flex-col gap-sm">
<!-- Map Actions -->
<div class="bg-surface/60 backdrop-blur-[16px] border border-white/10 rounded-full flex flex-col shadow-[0_8px_24px_rgba(0,0,0,0.3)] overflow-hidden">
<button class="p-3 text-on-surface-variant hover:text-primary hover:bg-white/5 transition-all active:bg-white/10 border-b border-white/5">
<span class="material-symbols-outlined icon-fill">explore</span>
</button>
<button class="p-3 text-on-surface-variant hover:text-primary hover:bg-white/5 transition-all active:bg-white/10 border-b border-white/5">
<span class="material-symbols-outlined">add</span>
</button>
<button class="p-3 text-on-surface-variant hover:text-primary hover:bg-white/5 transition-all active:bg-white/10">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
<!-- Recenter -->
<button class="bg-surface/60 backdrop-blur-[16px] border border-white/10 rounded-full p-3 shadow-[0_8px_24px_rgba(0,0,0,0.3)] text-on-surface hover:text-primary hover:bg-white/5 transition-all active:scale-95 flex items-center justify-center mt-xs">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</main>
<!-- Bottom Section: Dashboard (Level 2 Floating) -->
<footer class="pb-[env(safe-area-inset-bottom,20px)] px-margin-mobile w-full pointer-events-auto">
<div class="bg-surface-container/80 backdrop-blur-[32px] border border-white/10 rounded-[32px] p-lg shadow-[0_24px_48px_rgba(0,0,0,0.6)] mb-md relative overflow-hidden">
<!-- Subtle Gradient Glow inside card -->
<div class="absolute -top-24 -left-12 w-48 h-48 bg-primary/10 rounded-full blur-[60px] pointer-events-none"></div>
<div class="grid grid-cols-3 gap-md relative z-10">
<!-- Primary Stat: Speed -->
<div class="col-span-1 flex flex-col justify-end border-r border-white/10 pr-md">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs">SPEED</span>
<div class="flex items-baseline gap-1">
<span class="font-display-stat text-display-stat text-on-surface tracking-tighter">45</span>
<span class="font-label-caps text-label-caps text-primary">KM/H</span>
</div>
</div>
<!-- Secondary Stats -->
<div class="col-span-2 grid grid-cols-2 gap-md pl-sm">
<!-- Remaining Distance -->
<div class="flex flex-col justify-end">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">route</span> LEFT
                            </span>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg text-headline-lg text-on-surface">8.2</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">KM</span>
</div>
</div>
<!-- ETA -->
<div class="flex flex-col justify-end">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> ETA
                            </span>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg text-headline-lg text-on-surface">14:32</span>
</div>
</div>
</div>
</div>
<!-- Primary Action: Stop/Pause (Integrated into dashboard bottom) -->
<div class="mt-lg pt-md border-t border-white/5 flex justify-center gap-md">
<button class="flex-1 bg-white/5 hover:bg-white/10 active:bg-white/20 transition-colors border border-white/10 rounded-full py-3 flex items-center justify-center gap-2">
<span class="material-symbols-outlined icon-fill text-on-surface">pause</span>
<span class="font-stat-label text-stat-label text-on-surface">Pause</span>
</button>
<button class="flex-1 bg-error/20 hover:bg-error/30 active:bg-error/40 transition-colors border border-error/30 text-error rounded-full py-3 flex items-center justify-center gap-2">
<span class="material-symbols-outlined icon-fill">stop_circle</span>
<span class="font-stat-label text-stat-label">End Ride</span>
</button>
</div>
</div>
</footer>
</div>
</body></html>
