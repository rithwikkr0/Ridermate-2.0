<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.9); opacity: 0.8; }

            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

            background: linear-gradient(90deg, rgba(255,107,0,0) 0%, rgba(255,107,0,0.1) 50%, rgba(255,107,0,0) 100%);

<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Effect -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-error-container/30 via-background to-background"></div>
<div class="absolute inset-0 z-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMSIgZmlsbD0iI2ZmZmZmZiIvPjwvc3ZnPg==')]"></div>
<main class="flex-1 flex flex-col items-center justify-between p-margin-mobile relative z-10 w-full max-w-lg mx-auto">
<!-- Header -->
<div class="w-full text-center mt-xl space-y-unit">
<span class="material-symbols-outlined text-[48px] text-error mb-sm animate-pulse">warning</span>
<h1 class="font-headline-lg text-headline-lg text-error tracking-tight">EMERGENCY SOS ACTIVATED</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Broadcasting location to emergency contacts and nearby riders...</p>
</div>
<!-- Massive Countdown -->
<div class="relative flex items-center justify-center my-xl">
<!-- Pulsating Rings -->
<div class="absolute w-64 h-64 rounded-full border-4 border-primary-container/20 animate-pulse-ring"></div>
<div class="absolute w-72 h-72 rounded-full border-2 border-error/10 animate-pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Core Ring -->
<div class="w-56 h-56 rounded-full bg-surface-container-highest/80 backdrop-blur-[12px] border border-white/10 shadow-[0px_12px_32px_rgba(255,107,0,0.4)] flex flex-col items-center justify-center z-10 relative group hover:bg-surface-container-high transition-colors cursor-pointer" onclick="cancelSOS()">
<div class="absolute inset-0 rounded-full bg-gradient-to-b from-white/5 to-transparent pointer-events-none"></div>
<span class="font-display-stat text-[72px] leading-none text-primary-container mb-unit" id="countdownDisplay">10</span>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest group-hover:text-primary-container transition-colors">Cancel</span>
</div>
</div>
<!-- Contacts Status -->
<div class="w-full bg-surface-container/60 backdrop-blur-[12px] rounded-xl border border-white/10 p-md mb-xl shadow-[0px_4px_20px_rgba(0,0,0,0.2)]">
<h3 class="font-stat-label text-stat-label text-on-surface-variant mb-md flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">cell_tower</span>
                NOTIFIED CONTACTS
            </h3>
<ul class="space-y-sm">
<li class="flex items-center justify-between p-sm bg-white/5 rounded-lg border border-white/5 shimmer-bg">
<div class="flex items-center gap-3">

<li class="flex items-center justify-between p-sm bg-white/5 rounded-lg border border-white/5">

            </button>

</main>
<script>
        let count = 10;
        const display = document.getElementById('countdownDisplay');
        const interval = setInterval(() => {
            count--;
            if(count >= 0) {
                display.innerText = count;
            } else {
                clearInterval(interval);
                display.innerText = "0";
            }
        }, 1000);

        function cancelSOS() {
            clearInterval(interval);
            alert('SOS Cancelled. Returning to safe mode.');
            // Implementation for cancelling SOS would go here
        }
    </script>
