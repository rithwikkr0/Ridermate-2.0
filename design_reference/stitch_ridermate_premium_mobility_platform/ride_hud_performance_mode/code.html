<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate - Ride HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-fixed-dim": "#ffb693",
                        "primary-container": "#ff6b00",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-variant": "#333535",
                        "on-error": "#690005",
                        "surface-tint": "#ffb693",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#1b1c1c",
                        "tertiary-container": "#9a9999",
                        "on-tertiary-container": "#313131",
                        "on-primary-fixed": "#351000",
                        "surface-dim": "#121414",
                        "on-tertiary": "#303030",
                        "error-container": "#93000a",
                        "surface-bright": "#37393a",
                        "on-surface": "#e2e2e2",
                        "surface": "#121414",
                        "on-secondary-container": "#bab8b7",
                        "inverse-on-surface": "#2f3131",
                        "on-secondary-fixed": "#1c1b1b",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-highest": "#333535",
                        "on-primary": "#561f00",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-container": "#572000",
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-container-high": "#282a2b",
                        "tertiary": "#c8c6c5",
                        "on-secondary": "#313030",
                        "on-surface-variant": "#e2bfb0",
                        "on-background": "#e2e2e2",
                        "inverse-primary": "#a04100",
                        "outline": "#a98a7d",
                        "surface-container": "#1e2020",
                        "secondary-container": "#4a4949",
                        "primary": "#ffb693",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-container-low": "#1a1c1c",
                        "background": "#121414",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-container-lowest": "#0c0f0f",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "primary-fixed": "#ffdbcc",
                        "secondary": "#c8c6c5"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "16px",
                        "md": "16px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "margin-mobile": "20px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "display-stat": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "stat-label": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "display-stat": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "stat-label": ["14px", { lineHeight: "20px", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background-color: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex flex-col relative antialiased">
<!-- Background Map Glimpse -->
<div class="absolute inset-0 z-0 opacity-40">
<img class="w-full h-full object-cover" data-alt="A dark, minimalist topographic map background showing winding mountain roads. The map uses deep charcoal blacks and subtle grey contour lines, with faint, glowing Circuit Orange accents highlighting the intended route. The lighting is low and moody, conveying a high-performance, nighttime riding environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhFEJm5HyrXcwUG_CuGM44COG52lVDjiYWM_EMDqI1e0FC3diUczeMxQ0zyWT0mIa23PuLo8Axv9q4A95U-1ZLhBjm-DgR_1yw1ZiojzcBQeop04r5jENEikasfwjeREgSS39r8MdqT8RiaU4CFBD2L2EJn3c0g7zhxZMNbXfAl5c_2wiFrVIv34oTZcSA6e3W77M7sNNVOaflwTE4zxch466PKEEymA4sOO7bmg89odGYBFKjiDmElw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
</div>
<!-- HUD Content Area -->
<main class="relative z-10 flex-1 flex flex-col p-margin-mobile gap-gutter">
<!-- Top Status Bar (Minimalist) -->
<header class="flex justify-between items-center w-full mt-2">
<div class="flex items-center gap-2 text-on-surface-variant font-label-caps text-label-caps">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
<span>98%</span>
</div>
<div class="flex items-center gap-2 text-primary font-label-caps text-label-caps">
<span class="material-symbols-outlined text-[16px] animate-pulse">radio_button_checked</span>
<span>REC</span>
<span class="text-on-surface ml-2">01:24:36</span>
</div>
</header>
<!-- Main HUD Centerpiece: Speedometer -->
<div class="flex-1 flex flex-col items-center justify-center relative my-4">
<!-- Circular Progress SVG -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_15px_rgba(255,107,0,0.3)]" viewbox="0 0 120 120">
<circle class="text-surface-variant" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary-container progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke="currentColor" stroke-dasharray="339.292" stroke-dashoffset="84.823" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="text-center z-10">
<div class="font-display-stat text-display-stat text-on-surface tracking-tighter">42.5</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-1">KM/H</div>
<div class="font-stat-label text-stat-label text-primary mt-2 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span>Avg: 38.2</span>
</div>
</div>
</div>
</div>
<!-- Secondary Metrics Grid (Bento Style) -->
<div class="grid grid-cols-2 gap-gutter pb-6">
<!-- Power Widget -->
<div class="glass-card rounded-xl p-md shadow-sm hover:opacity-80 transition-opacity">
<div class="flex items-start justify-between">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block mb-1">POWER</span>
<div class="font-headline-lg text-headline-lg text-on-surface">320<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">W</span></div>
</div>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="mt-4 h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[75%] rounded-full"></div>
</div>
</div>
<!-- Heart Rate Widget -->
<div class="glass-card rounded-xl p-md shadow-sm hover:opacity-80 transition-opacity">
<div class="flex items-start justify-between">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block mb-1">HEART RATE</span>
<div class="font-headline-lg text-headline-lg text-error">165<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">BPM</span></div>
</div>
<span class="material-symbols-outlined text-error animate-pulse" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="mt-4 flex gap-1">
<div class="h-8 w-1 bg-error-container rounded-sm"></div>
<div class="h-6 w-1 bg-error-container rounded-sm"></div>
<div class="h-10 w-1 bg-error rounded-sm"></div>
<div class="h-7 w-1 bg-error-container rounded-sm"></div>
<div class="h-9 w-1 bg-error-container rounded-sm"></div>
</div>
</div>
<!-- Altitude Widget -->
<div class="glass-card rounded-xl p-md shadow-sm hover:opacity-80 transition-opacity">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">terrain</span>
</div>
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block">ALTITUDE</span>
<div class="font-headline-md text-headline-md text-on-surface">1,240<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">M</span></div>
</div>
</div>
</div>
<!-- Temp & Grade Widget -->
<div class="glass-card rounded-xl p-md shadow-sm hover:opacity-80 transition-opacity flex justify-between items-center">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block">TEMP</span>
<div class="font-headline-md text-headline-md text-on-surface">18°<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">C</span></div>
</div>
<div class="w-[1px] h-10 bg-white/10"></div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block">GRADE</span>
<div class="font-headline-md text-headline-md text-primary">+4.2%</div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button (Primary Action - End/Pause Ride) -->
<button class="fixed bottom-margin-mobile right-margin-mobile z-50 w-14 h-14 bg-primary-container text-white rounded-full flex items-center justify-center shadow-[0_12px_32px_rgba(255,107,0,0.4)] backdrop-blur-[20px] hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</body></html>
