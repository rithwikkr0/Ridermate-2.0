<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Route Planning - RiderMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Hanken+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#bab8b7",
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#4a4949",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474646",
                        "secondary": "#c8c6c5",
                        "on-primary-container": "#572000",
                        "inverse-primary": "#a04100",
                        "surface-container": "#1e2020",
                        "on-secondary": "#313030",
                        "primary-fixed": "#ffdbcc",
                        "on-surface-variant": "#e2bfb0",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-tertiary-container": "#313131",
                        "on-surface": "#121414", // Adjusted for light mode context if needed, but sticking to config as much as possible while maintaining light feel via bg
                        "surface-bright": "#f5f5f5", // Custom override for true light feel since config leans dark
                        "surface": "#ffffff", // Override for light mode
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-primary-fixed": "#351000",
                        "on-primary": "#ffffff", // Adjusted for orange primary
                        "on-background": "#121414", // Override for light
                        "primary-container": "#ff6b00",
                        "surface-container-low": "#f8f9fa", // Override
                        "primary-fixed-dim": "#ffb693",
                        "tertiary-container": "#9a9999",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-tint": "#ffb693",
                        "surface-variant": "#f0f0f0", // Override
                        "tertiary-fixed": "#e4e2e1",
                        "inverse-on-surface": "#2f3131",
                        "surface-container-highest": "#e0e0e0", // Override
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary": "#c8c6c5",
                        "error-container": "#93000a",
                        "primary": "#ff6b00", // Enforcing Circuit Orange
                        "error": "#ffb4ab",
                        "outline": "#d1d1d1", // Override
                        "background": "#f8f9fa", // Override for light mode base
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-dim": "#ececec", // Override
                        "surface-container-lowest": "#ffffff", // Override
                        "surface-container-high": "#ebebeb", // Override
                        "on-tertiary": "#303030"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.5rem",
                        "3xl": "2rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "stat-label": ["Inter"],
                        "display-stat": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "boxShadow": {
                        "glass": "0 4px 30px rgba(0, 0, 0, 0.05)",
                        "glass-float": "0 12px 32px rgba(255, 107, 0, 0.15)"
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        
        /* Map Background Simulation */
        body {
            background-color: #f0f2f5;
            background-image: radial-gradient(#d0d4db 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen relative font-body-md overflow-x-hidden selection:bg-primary/20 selection:text-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-3xl shadow-sm border-b border-black/5 flex justify-between items-center px-margin-mobile py-md transition-all duration-300">
<div class="flex items-center gap-3">
<button class="hover:opacity-80 transition-opacity active:scale-90 text-on-background bg-black/5 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">RiderMate</h1>
</div>
<div class="flex items-center gap-3">
<button class="text-on-background hover:opacity-80 transition-opacity scale-95 active:scale-90 bg-black/5 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">tune</span>
</button>
</div>
</header>
<!-- Main Map Canvas Area (Simulated) -->
<main class="pt-[88px] pb-[120px] px-margin-mobile h-screen flex flex-col pointer-events-none">
<!-- Search & Filter Floating Card -->
<div class="glass-panel rounded-2xl p-4 mt-sm pointer-events-auto transition-transform hover:shadow-glass-float">
<div class="flex items-center bg-black/5 rounded-xl px-4 py-3 border border-black/5 focus-within:border-primary/50 focus-within:bg-white transition-colors">
<span class="material-symbols-outlined text-on-background/50 mr-3">search</span>
<input class="bg-transparent border-none outline-none w-full font-body-md text-body-md text-on-background placeholder:text-on-background/40 p-0 focus:ring-0" placeholder="Search destination or route..." type="text"/>
<button class="ml-2 text-primary hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
<div class="flex gap-2 mt-4 overflow-x-auto hide-scrollbar pb-1">
<button class="shrink-0 px-4 py-1.5 rounded-full border border-primary bg-primary/10 text-primary font-label-caps text-label-caps whitespace-nowrap active:scale-95 transition-transform">
                    All Routes
                </button>
<button class="shrink-0 px-4 py-1.5 rounded-full border border-black/10 bg-white text-on-background/70 font-label-caps text-label-caps whitespace-nowrap hover:bg-black/5 active:scale-95 transition-colors">
                    Scenic
                </button>
<button class="shrink-0 px-4 py-1.5 rounded-full border border-black/10 bg-white text-on-background/70 font-label-caps text-label-caps whitespace-nowrap hover:bg-black/5 active:scale-95 transition-colors">
                    Twisties
                </button>
<button class="shrink-0 px-4 py-1.5 rounded-full border border-black/10 bg-white text-on-background/70 font-label-caps text-label-caps whitespace-nowrap hover:bg-black/5 active:scale-95 transition-colors">
                    Off-Road
                </button>
</div>
</div>
<div class="flex-grow flex items-center justify-center">
<!-- Placeholder for map pin -->
<div class="w-12 h-12 bg-primary/20 rounded-full flex items-center justify-center animate-pulse pointer-events-auto relative">
<div class="w-4 h-4 bg-primary rounded-full shadow-[0_0_15px_rgba(255,107,0,0.8)]"></div>
<div class="absolute -top-10 bg-white px-3 py-1 rounded-lg shadow-sm border border-black/5 text-sm font-semibold text-on-background whitespace-nowrap pointer-events-none">
                     Current Loc
                     <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-white rotate-45 border-r border-b border-black/5"></div>
</div>
</div>
</div>
<!-- Floating Route Suggestion Card (Bottom Sheet Peek) -->
<div class="glass-panel rounded-t-3xl p-margin-mobile pointer-events-auto absolute bottom-0 left-0 w-full shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t border-white pb-[100px]">
<div class="w-12 h-1.5 bg-black/10 rounded-full mx-auto mb-6"></div>
<div class="flex justify-between items-end mb-4">
<div>
<span class="font-label-caps text-label-caps text-primary mb-1 block">RECOMMENDED</span>
<h2 class="font-headline-md text-headline-md font-bold text-on-background">Pacific Coast Hwy</h2>
</div>
<div class="text-right">
<span class="font-display-stat text-3xl font-bold text-on-background tracking-tight">142</span>
<span class="font-label-caps text-label-caps text-on-background/60">KM</span>
</div>
</div>
<div class="grid grid-cols-3 gap-gutter mb-6">
<div class="bg-black/5 rounded-xl p-3 flex flex-col items-center justify-center border border-black/5">
<span class="material-symbols-outlined text-on-background/70 mb-1 text-sm">schedule</span>
<span class="font-stat-label text-stat-label text-on-background">2h 15m</span>
</div>
<div class="bg-black/5 rounded-xl p-3 flex flex-col items-center justify-center border border-black/5">
<span class="material-symbols-outlined text-on-background/70 mb-1 text-sm">terrain</span>
<span class="font-stat-label text-stat-label text-on-background">Curvy</span>
</div>
<div class="bg-black/5 rounded-xl p-3 flex flex-col items-center justify-center border border-black/5">
<span class="material-symbols-outlined text-on-background/70 mb-1 text-sm">tamper_detection_off</span>
<span class="font-stat-label text-stat-label text-on-background">18°C</span>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full shadow-glass-float transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                START RIDE
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-margin-mobile right-margin-mobile z-50 flex justify-around items-center py-sm bg-surface/80 backdrop-blur-[30px] rounded-full border border-black/5 shadow-[0_12px_32px_rgba(0,0,0,0.08)]">
<a class="flex flex-col items-center justify-center text-on-background/50 px-4 py-2 hover:bg-black/5 transition-colors active:scale-95 rounded-full" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-[10px] mt-1 font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold bg-primary/10 rounded-full px-4 py-2 active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-label-caps text-[10px] mt-1 font-bold">Nav</span>
</a>
<a class="flex flex-col items-center justify-center text-on-background/50 px-4 py-2 hover:bg-black/5 transition-colors active:scale-95 rounded-full" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">psychology</span>
<span class="font-label-caps text-[10px] mt-1 font-medium">Coach</span>
</a>
<a class="flex flex-col items-center justify-center text-on-background/50 px-4 py-2 hover:bg-black/5 transition-colors active:scale-95 rounded-full" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">insights</span>
<span class="font-label-caps text-[10px] mt-1 font-medium">Stats</span>
</a>
<a class="flex flex-col items-center justify-center text-on-background/50 px-4 py-2 hover:bg-black/5 transition-colors active:scale-95 rounded-full" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-[10px] mt-1 font-medium">Profile</span>
</a>
</nav>
<script>
        // Micro-interactions for inputs
        document.querySelectorAll('input, button').forEach(el => {
            el.addEventListener('touchstart', () => {}, {passive: true});
        });
    </script>
</body></html>
