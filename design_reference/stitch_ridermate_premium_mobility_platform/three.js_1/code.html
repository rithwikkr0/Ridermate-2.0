<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_65 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_65" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_65');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_203');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  // AI "Orb" Core
  const group = new THREE.Group();
  scene.add(group);

  // Outer ring
  const ringGeo = new THREE.TorusGeometry(1.2, 0.02, 16, 100);
  const ringMat = new THREE.MeshPhongMaterial({ color: 0xff6b00, emissive: 0xff6b00, emissiveIntensity: 0.5 });
  const ring1 = new THREE.Mesh(ringGeo, ringMat);
  group.add(ring1);

  const ring2 = new THREE.Mesh(ringGeo, ringMat);
  ring2.rotation.x = Math.PI / 2;
  group.add(ring2);

  // Inner data points (Particles)
  const particlesCount = 200;
  const positions = new Float32Array(particlesCount * 3);
  for(let i=0; i<particlesCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 2;
  }
  const partGeo = new THREE.BufferGeometry();
  partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const partMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.02, transparent: true, opacity: 0.8 });
  const points = new THREE.Points(partGeo, partMat);
  group.add(points);

  const light = new THREE.PointLight(0xffffff, 1, 100);
  light.position.set(5, 5, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  camera.position.z = 3;

  function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.01;
    group.rotation.z += 0.005;
    
    const time = Date.now() * 0.002;
    ring1.scale.setScalar(1 + Math.sin(time) * 0.05);
    ring2.scale.setScalar(1 + Math.cos(time) * 0.05);
    
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_65 -->
</body>
</html>
