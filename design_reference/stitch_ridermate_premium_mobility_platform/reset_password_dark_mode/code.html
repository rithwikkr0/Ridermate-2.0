<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background-color: rgba(30, 32, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: #0A0A0A;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 107, 0, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 107, 0, 0.08), transparent 25%);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden antialiased">
<!-- Ambient glowing orb -->
<div class="absolute top-1/4 -left-32 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[128px] opacity-10 animate-pulse"></div>
<div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[128px] opacity-10 animate-pulse" style="animation-delay: 2s;"></div>
<div class="w-full max-w-md z-10">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm tracking-tight">RiderMate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure your cockpit. Create a new password.</p>
</div>
<!-- Glassmorphic Form Card -->
<div class="glass-card rounded-xl p-lg shadow-[0_4px_20px_rgba(255,107,0,0.05)]">
<form action="#" class="space-y-lg" method="POST">
<!-- New Password Field -->
<div class="space-y-xs">
<label class="block font-stat-label text-stat-label text-on-surface-variant" for="new-password">New Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="block w-full pl-[44px] pr-md py-sm bg-surface-dim border border-white/10 rounded-lg text-on-surface placeholder-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md" id="new-password" name="new-password" placeholder="Enter new password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="block font-stat-label text-stat-label text-on-surface-variant" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock_reset</span>
</span>
<input class="block w-full pl-[44px] pr-md py-sm bg-surface-dim border border-white/10 rounded-lg text-on-surface placeholder-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md" id="confirm-password" name="confirm-password" placeholder="Confirm new password" type="password"/>
</div>
</div>
<!-- Security Checklist -->
<div class="bg-surface-dim/50 rounded-lg p-md border border-white/5 space-y-sm">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase tracking-wider">Security Requirements</p>
<ul class="space-y-unit">
<li class="flex items-center text-primary/80 font-body-md text-stat-label">
<span class="material-symbols-outlined text-[16px] mr-sm">check_circle</span>
                            At least 8 characters
                        </li>
<li class="flex items-center text-on-surface-variant font-body-md text-stat-label">
<span class="material-symbols-outlined text-[16px] mr-sm">radio_button_unchecked</span>
                            One uppercase letter
                        </li>
<li class="flex items-center text-on-surface-variant font-body-md text-stat-label">
<span class="material-symbols-outlined text-[16px] mr-sm">radio_button_unchecked</span>
                            One number or symbol
                        </li>
</ul>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-white font-headline-md text-stat-label py-md rounded-full hover:bg-primary-container/90 active:scale-[0.98] transition-all duration-200 shadow-[0_12px_32px_rgba(255,107,0,0.4)] flex justify-center items-center group" type="submit">
                        Update Password
                        <span class="material-symbols-outlined ml-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<div class="text-center mt-md">
<a class="font-body-md text-stat-label text-on-surface-variant hover:text-primary transition-colors inline-flex items-center" href="#">
<span class="material-symbols-outlined text-[18px] mr-xs">arrow_back</span> Back to Login
                     </a>
</div>
</form>
</div>
</div>
