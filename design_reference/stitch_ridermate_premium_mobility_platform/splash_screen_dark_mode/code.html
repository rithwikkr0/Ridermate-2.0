<style>
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.15) 0%, rgba(18, 20, 20, 0) 70%);
            z-index: 0;
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }

        .glass-text {
            background: linear-gradient(to right, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            position: relative;
            z-index: 10;
        }

        .shimmer-container {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .shimmer-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite linear;
            z-index: 20;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }
        
        .loading-line {
            width: 120px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            margin-top: 40px;
        }
        
        .loading-line::after {
            content: '';
            position: absolute;
            left: -50%;
            top: 0;
            height: 100%;
            width: 50%;
            background: #ff6b00;
            animation: loading 2s infinite ease-in-out;
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.8);
        }
        
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        .bg-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative bg-pattern">
<!-- Ambient Glow -->
<div class="glow-effect"></div>
<!-- Central Branding -->
<div class="flex flex-col items-center justify-center z-10 relative">
<div class="shimmer-container mb-2">
<h1 class="font-display-stat text-display-stat glass-text font-extrabold tracking-tight">RiderMate</h1>
</div>
<p class="font-label-caps text-label-caps text-primary tracking-widest uppercase opacity-80 mt-unit">Kinetic Precision</p>
<!-- Loading Indicator -->
<div class="loading-line z-10"></div>
</div>
<!-- Version/Status Info (Bottom) -->
<div class="absolute bottom-margin-mobile left-0 w-full text-center opacity-40 z-10">
<p class="font-label-caps text-label-caps text-on-surface-variant">System Initializing // V.2.4.1</p>
</div>
</body></html>
