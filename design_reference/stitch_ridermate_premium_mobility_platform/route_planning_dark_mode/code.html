<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Route Planning - RiderMate</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#bab8b7",
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#4a4949",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474646",
                        "secondary": "#c8c6c5",
                        "on-primary-container": "#572000",
                        "inverse-primary": "#a04100",
                        "surface-container": "#1e2020",
                        "on-secondary": "#313030",
                        "primary-fixed": "#ffdbcc",
                        "on-surface-variant": "#e2bfb0",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-tertiary-container": "#313131",
                        "on-surface": "#e2e2e2",
                        "surface-bright": "#37393a",
                        "surface": "#121414",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-primary-fixed": "#351000",
                        "on-primary": "#561f00",
                        "on-background": "#e2e2e2",
                        "primary-container": "#ff6b00",
                        "surface-container-low": "#1a1c1c",
                        "primary-fixed-dim": "#ffb693",
                        "tertiary-container": "#9a9999",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-tertiary-fixed": "#1b1c1c",
                        "surface-tint": "#ffb693",
                        "surface-variant": "#333535",
                        "tertiary-fixed": "#e4e2e1",
                        "inverse-on-surface": "#2f3131",
                        "surface-container-highest": "#333535",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary": "#c8c6c5",
                        "error-container": "#93000a",
                        "primary": "#ffb693",
                        "error": "#ffb4ab",
                        "outline": "#a98a7d",
                        "background": "#121414",
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-dim": "#121414",
                        "surface-container-lowest": "#0c0f0f",
                        "surface-container-high": "#282a2b",
                        "on-tertiary": "#303030"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "stat-label": ["Inter"],
                        "display-stat": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-panel {
            background: rgba(30, 32, 32, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .level-2-shadow {
            box-shadow: 0px 12px 32px rgba(255, 107, 0, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Map Background -->
<div class="fixed inset-0 w-full h-full z-0">
<!-- Using a placeholder background image for the map, ideally this would be a mapbox/google maps instance -->
<div class="w-full h-full bg-surface-container-low relative" data-alt="A highly detailed, top-down dark mode digital map showing a winding mountain road route. The route is highlighted in vibrant Circuit Orange (#FF6B00) against a minimalist dark gray and black terrain. Subtle elevation contours and soft glowing waypoints add to the high-tech, precision-engineered aesthetic of a premium performance tracking app." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBqcglOM3rR73YmY32b3inMPCivCiToOVzwHrpGUX36-wdugnFjRBGz8kQeDpFcmV6gHbmA9Wgv1kpHOKKC5_1xfJfSa143a08resomjvrNUwRz8y7Pu83JrDIuC_WtRHXw19iGvA8XixAvxrzCTiD3EyQjHBM80CkdFSM8GdSIKwuhcEM53manr5EeVZWVOJS7TTuXPmK9T99NZmJGdGoGKxwa_r7cdSZ_8NYb5Nu1Lb2kcZlH-bZ9_g')">
<!-- Simulated Route Path SVG -->
<svg class="absolute inset-0 w-full h-full opacity-80" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="drop-shadow-[0_0_8px_rgba(255,107,0,0.6)]" d="M 20 80 Q 40 60, 50 40 T 80 20" fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<!-- Start Point -->
<circle cx="20" cy="80" fill="#121414" r="2.5" stroke="#ff6b00" stroke-width="1.5"></circle>
<circle cx="20" cy="80" fill="#ff6b00" r="1"></circle>
<!-- End Point -->
<circle cx="80" cy="20" fill="#ff6b00" r="3"></circle>
<path d="M 78.5 20 L 80 21.5 L 82.5 18" fill="none" stroke="#121414" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.8"></path>
</svg>
</div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-background/80 via-transparent to-background/90 pointer-events-none"></div>
</div>
<!-- Top Navigation (Back button & Route Title) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-md bg-surface/60 backdrop-blur-3xl border-b border-white/10 shadow-sm transition-transform">
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Morning Alpine Loop</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</header>
<!-- Floating UI - Bottom Sheet -->
<div class="fixed bottom-0 w-full z-40 px-sm pb-sm">
<div class="glass-panel rounded-t-[32px] rounded-b-xl px-margin-mobile pt-lg pb-margin-mobile w-full max-w-2xl mx-auto flex flex-col gap-gutter shadow-[0_-8px_32px_rgba(0,0,0,0.5)]">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-2"></div>
<!-- Route Options Selector -->
<div class="flex gap-2 p-1 bg-surface-container rounded-full border border-white/5">
<!-- Selected Option -->
<button class="flex-1 py-2 px-4 rounded-full bg-primary-container text-white font-stat-label text-stat-label shadow-[0_2px_10px_rgba(255,107,0,0.3)] transition-all flex flex-col items-center justify-center">
<span>Fastest</span>
<span class="font-label-caps text-[10px] text-white/80">32 MIN</span>
</button>
<!-- Unselected Options -->
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-primary transition-colors font-stat-label text-stat-label flex flex-col items-center justify-center">
<span>Balanced</span>
<span class="font-label-caps text-[10px] opacity-70">45 MIN</span>
</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-primary transition-colors font-stat-label text-stat-label flex flex-col items-center justify-center">
<span>Scenic</span>
<span class="font-label-caps text-[10px] opacity-70">55 MIN</span>
</button>
</div>
<!-- Route Details (Fastest) -->
<div class="flex flex-col gap-4 mt-2">
<!-- Stats Row -->
<div class="flex justify-between items-end">
<div>
<div class="font-label-caps text-label-caps text-primary mb-1">DISTANCE</div>
<div class="font-display-stat text-display-stat text-on-surface leading-none">12.4<span class="text-headline-md text-on-surface-variant ml-1">km</span></div>
</div>
<div class="text-right">
<div class="font-label-caps text-label-caps text-tertiary mb-1">ELEVATION GAIN</div>
<div class="font-headline-lg text-headline-lg text-on-surface leading-none">420<span class="text-body-md text-on-surface-variant ml-1">m</span></div>
</div>
</div>
<!-- Sparkline Chart -->
<div class="h-16 w-full rounded-lg bg-surface-container-low border border-white/5 relative overflow-hidden flex items-end">
<!-- Faux Sparkline Area -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent"></div>
<svg class="w-full h-full relative z-10" preserveaspectratio="none" viewbox="0 0 100 20">
<path d="M 0 20 L 0 15 Q 10 12, 20 18 T 40 10 T 60 5 T 80 8 T 100 2 L 100 20 Z" fill="rgba(255,107,0,0.1)"></path>
<path d="M 0 15 Q 10 12, 20 18 T 40 10 T 60 5 T 80 8 T 100 2" fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
<!-- Current Position Dot (Simulation) -->
<div class="absolute left-0 bottom-[25%] w-2 h-2 rounded-full bg-white shadow-[0_0_8px_#ff6b00] z-20 transform -translate-x-1/2 translate-y-1/2"></div>
</div>
<!-- Action Button -->
<button class="w-full mt-4 py-4 rounded-[24px] bg-primary-container text-white font-headline-md text-headline-md shadow-[0_4px_20px_rgba(255,107,0,0.4)] hover:shadow-[0_8px_30px_rgba(255,107,0,0.6)] hover:-translate-y-1 transition-all active:scale-[0.98] flex items-center justify-center gap-2 overflow-hidden relative">
<div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    Start Ride
                </button>
</div>
</div>
</div>
</body></html>
