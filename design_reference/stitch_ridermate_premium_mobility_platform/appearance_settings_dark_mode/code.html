<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Appearance Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed-variant": "#474646",
                      "on-primary-fixed-variant": "#7a3000",
                      "secondary-fixed-dim": "#c8c6c5",
                      "surface-container-low": "#1a1c1c",
                      "on-error": "#690005",
                      "on-secondary-fixed": "#1c1b1b",
                      "outline": "#a98a7d",
                      "on-primary-container": "#572000",
                      "on-surface": "#e2e2e2",
                      "outline-variant": "#5a4136",
                      "on-tertiary-fixed": "#1b1c1c",
                      "error-container": "#93000a",
                      "secondary": "#c8c6c5",
                      "tertiary": "#c8c6c5",
                      "surface-container-highest": "#333535",
                      "secondary-fixed": "#e5e2e1",
                      "surface-container-lowest": "#0c0f0f",
                      "on-tertiary": "#303030",
                      "on-secondary": "#313030",
                      "inverse-on-surface": "#2f3131",
                      "on-background": "#e2e2e2",
                      "background": "#121414",
                      "surface-dim": "#121414",
                      "secondary-container": "#4a4949",
                      "primary": "#ffb693",
                      "on-secondary-container": "#bab8b7",
                      "on-tertiary-fixed-variant": "#474746",
                      "surface": "#121414",
                      "on-primary": "#561f00",
                      "primary-container": "#ff6b00",
                      "primary-fixed-dim": "#ffb693",
                      "primary-fixed": "#ffdbcc",
                      "tertiary-container": "#9a9999",
                      "inverse-primary": "#a04100",
                      "error": "#ffb4ab",
                      "surface-container-high": "#282a2b",
                      "surface-container": "#1e2020",
                      "on-tertiary-container": "#313131",
                      "tertiary-fixed": "#e4e2e1",
                      "surface-tint": "#ffb693",
                      "inverse-surface": "#e2e2e2",
                      "on-error-container": "#ffdad6",
                      "surface-bright": "#37393a",
                      "tertiary-fixed-dim": "#c8c6c5",
                      "on-surface-variant": "#e2bfb0",
                      "surface-variant": "#333535",
                      "on-primary-fixed": "#351000"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "lg": "24px",
                      "xl": "32px",
                      "md": "16px",
                      "xs": "4px",
                      "gutter": "16px",
                      "margin-mobile": "20px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "stat-label": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "display-stat": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "stat-label": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-stat": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        body {
            background-color: #0A0A0A;
        }
        .glass-card {
            background: rgba(30, 32, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
        }
        .theme-preview {
            transition: all 0.2s ease-in-out;
        }
        .theme-preview:hover {
            border-color: rgba(255, 107, 0, 0.5);
        }
        .theme-preview.active {
            border-color: #ff6b00;
            box-shadow: 0 0 0 1px #ff6b00;
        }
        
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ff6b00;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0px 4px 12px rgba(255, 107, 0, 0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-[30px] border-b border-white/10 shadow-[0px_4px_20px_rgba(0,0,0,0.2)]">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full">
<button aria-label="Back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md tracking-tight text-primary dark:text-primary">APPEARANCE</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile max-w-3xl mx-auto w-full flex flex-col gap-gutter">
<!-- Theme Selection Bento -->
<section class="glass-card rounded-xl p-6 flex flex-col gap-6">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Theme</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select your preferred visual style.</p>
</div>
<div class="grid grid-cols-3 gap-4">
<!-- Light Theme Preview -->
<button aria-label="Select Light Theme" class="theme-preview rounded-lg p-2 border border-white/10 flex flex-col items-center gap-3 bg-surface-container-low">
<div class="w-full aspect-[9/16] bg-[#F5F5F5] rounded-md overflow-hidden flex flex-col p-2 border border-black/5 shadow-inner">
<div class="w-full h-2 bg-white rounded-sm mb-2 shadow-sm"></div>
<div class="flex-grow flex flex-col gap-2">
<div class="w-3/4 h-8 bg-white rounded-sm shadow-sm"></div>
<div class="w-full h-12 bg-white rounded-sm shadow-sm"></div>
</div>
<div class="w-full h-4 bg-[#FF6B00] rounded-sm mt-auto opacity-90"></div>
</div>
<span class="font-stat-label text-stat-label text-on-surface-variant">Light</span>
</button>
<!-- Dark Theme Preview (Active) -->
<button aria-label="Select Dark Theme" class="theme-preview active rounded-lg p-2 border border-white/10 flex flex-col items-center gap-3 bg-surface-container-low relative">
<div class="absolute top-2 right-2 text-primary">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-full aspect-[9/16] bg-[#0A0A0A] rounded-md overflow-hidden flex flex-col p-2 border border-white/10 shadow-inner">
<div class="w-full h-2 bg-[#1E2020] rounded-sm mb-2 shadow-sm"></div>
<div class="flex-grow flex flex-col gap-2">
<div class="w-3/4 h-8 bg-[#1E2020] rounded-sm shadow-sm"></div>
<div class="w-full h-12 bg-[#1E2020] rounded-sm shadow-sm"></div>
</div>
<div class="w-full h-4 bg-[#FF6B00] rounded-sm mt-auto opacity-90"></div>
</div>
<span class="font-stat-label text-stat-label text-primary">Dark</span>
</button>
<!-- System Theme Preview -->
<button aria-label="Select System Theme" class="theme-preview rounded-lg p-2 border border-white/10 flex flex-col items-center gap-3 bg-surface-container-low">
<div class="w-full aspect-[9/16] bg-gradient-to-r from-[#F5F5F5] to-[#0A0A0A] rounded-md overflow-hidden flex flex-col p-2 border border-white/10 shadow-inner">
<div class="w-full h-2 bg-gradient-to-r from-white to-[#1E2020] rounded-sm mb-2 shadow-sm"></div>
<div class="flex-grow flex flex-col gap-2">
<div class="w-3/4 h-8 bg-gradient-to-r from-white to-[#1E2020] rounded-sm shadow-sm"></div>
<div class="w-full h-12 bg-gradient-to-r from-white to-[#1E2020] rounded-sm shadow-sm"></div>
</div>
<div class="w-full h-4 bg-[#FF6B00] rounded-sm mt-auto opacity-90"></div>
</div>
<span class="font-stat-label text-stat-label text-on-surface-variant">System</span>
</button>
</div>
</section>
<!-- Typography & Density Controls -->
<section class="glass-card rounded-xl p-6 flex flex-col gap-8">
<!-- Font Size -->
<div>
<div class="flex justify-between items-end mb-4">
<div>
<h2 class="font-stat-label text-stat-label text-on-surface">Font Size</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">ADJUST TEXT SCALING</p>
</div>
<span class="font-label-caps text-label-caps text-primary">Medium</span>
</div>
<div class="flex items-center gap-4">
<span class="font-body-md text-body-md text-on-surface-variant">A</span>
<input aria-label="Font Size Slider" class="flex-grow" max="5" min="1" type="range" value="3"/>
<span class="font-headline-md text-headline-md text-on-surface-variant">A</span>
</div>
</div>
<hr class="border-white/5 border-t"/>
<!-- Display Density -->
<div>
<div class="flex justify-between items-end mb-4">
<div>
<h2 class="font-stat-label text-stat-label text-on-surface">Display Density</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">SPACING BETWEEN ELEMENTS</p>
</div>
<span class="font-label-caps text-label-caps text-primary">Comfortable</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">density_small</span>
<input aria-label="Display Density Slider" class="flex-grow" max="3" min="1" type="range" value="2"/>
<span class="material-symbols-outlined text-on-surface-variant">density_large</span>
</div>
</div>
</section>
</main>
<!-- Suppressed BottomNavBar & Drawer as per instructions for Settings screens (Transactional/Task-focused departure) -->
</body></html>
