<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Destination Search - RiderMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-fixed-dim": "#ffb693",
                        "primary-container": "#ff6b00",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-variant": "#333535",
                        "on-error": "#690005",
                        "surface-tint": "#ffb693",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#1b1c1c",
                        "tertiary-container": "#9a9999",
                        "on-tertiary-container": "#313131",
                        "on-primary-fixed": "#351000",
                        "surface-dim": "#121414",
                        "on-tertiary": "#303030",
                        "error-container": "#93000a",
                        "surface-bright": "#37393a",
                        "on-surface": "#121414",
                        "surface": "#f8f9fa",
                        "on-secondary-container": "#4a4949",
                        "inverse-on-surface": "#2f3131",
                        "on-secondary-fixed": "#1c1b1b",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-container": "#ffffff",
                        "outline-variant": "#d1d5db",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-container-high": "#e5e7eb",
                        "tertiary": "#6b7280",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#4b5563",
                        "on-background": "#121414",
                        "inverse-primary": "#a04100",
                        "outline": "#9ca3af",
                        "surface-container": "#f3f4f6",
                        "secondary-container": "#e5e7eb",
                        "primary": "#ff6b00",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-container-low": "#f9fafb",
                        "background": "#ffffff",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "primary-fixed": "#ffdbcc",
                        "secondary": "#6b7280"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "md": "16px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter", "sans-serif"],
                        "display-stat": ["Hanken Grotesk", "sans-serif"],
                        "label-caps": ["JetBrains Mono", "monospace"],
                        "stat-label": ["Inter", "sans-serif"],
                        "headline-md": ["Hanken Grotesk", "sans-serif"],
                        "headline-lg": ["Hanken Grotesk", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card-light {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .glass-search-light {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-x-hidden selection:bg-primary/20 selection:text-primary">
<!-- Destination Search Content -->
<main class="relative z-10 w-full min-h-screen px-margin-mobile pt-[120px] pb-32">
<!-- Floating Search Bar -->
<div class="fixed top-0 left-0 right-0 z-50 px-margin-mobile pt-10 pb-4 bg-gradient-to-b from-background via-background/90 to-transparent">
<div class="glass-search-light rounded-full flex items-center px-4 py-3 gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors text-on-surface-variant flex items-center justify-center group">
<span class="material-symbols-outlined group-active:scale-90 transition-transform">arrow_back</span>
</button>
<input autofocus="" class="flex-1 bg-transparent border-none outline-none focus:ring-0 text-body-lg text-on-background placeholder:text-on-surface-variant/70 p-0" placeholder="Where to?" type="text"/>
<button class="p-2 -mr-2 rounded-full hover:bg-surface-container transition-colors text-primary flex items-center justify-center group">
<span class="material-symbols-outlined group-active:scale-90 transition-transform" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
<div class="flex flex-col gap-lg max-w-md mx-auto">
<!-- Saved Places Section -->
<section>
<h2 class="font-stat-label text-stat-label text-on-surface-variant mb-4 pl-2 uppercase tracking-wider">Saved Places</h2>
<div class="flex flex-col gap-sm">
<!-- Home -->
<button class="glass-card-light rounded-2xl p-4 flex items-center gap-4 hover:bg-surface-container/50 transition-colors text-left group">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex-1">
<h3 class="font-stat-label text-stat-label text-on-background">Home</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5 truncate">124 Valley Road, Portland</p>
</div>
</button>
<!-- Work -->
<button class="glass-card-light rounded-2xl p-4 flex items-center gap-4 hover:bg-surface-container/50 transition-colors text-left group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:scale-105 transition-transform group-hover:text-primary group-hover:bg-primary/10">
<span class="material-symbols-outlined">work</span>
</div>
<div class="flex-1">
<h3 class="font-stat-label text-stat-label text-on-background">Work</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5 truncate">Tech Hub, Downtown</p>
</div>
</button>
<!-- Cafe Velodrome -->
<button class="glass-card-light rounded-2xl p-4 flex items-center gap-4 hover:bg-surface-container/50 transition-colors text-left group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:scale-105 transition-transform group-hover:text-primary group-hover:bg-primary/10">
<span class="material-symbols-outlined">local_cafe</span>
</div>
<div class="flex-1">
<h3 class="font-stat-label text-stat-label text-on-background">Cafe Velodrome</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5 truncate">88 Cycle Lane, Eastside</p>
</div>
</button>
</div>
</section>
<!-- Recent Searches Section -->
<section class="mt-4">
<div class="flex items-center justify-between mb-4 pl-2 pr-2">
<h2 class="font-stat-label text-stat-label text-on-surface-variant uppercase tracking-wider">Recent</h2>
<button class="font-label-caps text-label-caps text-primary hover:opacity-80 transition-opacity">CLEAR</button>
</div>
<div class="grid grid-cols-1 gap-sm">
<!-- Canyon Pass -->
<div class="glass-card-light rounded-2xl p-4 flex items-center gap-4 hover:bg-surface-container/50 transition-colors cursor-pointer group">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center text-on-surface-variant/60 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">history</span>
</div>
<div class="flex-1">
<h3 class="font-stat-label text-stat-label text-on-background">Canyon Pass Route</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-xs mt-0.5 truncate">45km • 800m elevation</p>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant/40 hover:text-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-[18px]">north_west</span>
</button>
</div>
<!-- Beachside Loop -->
<div class="glass-card-light rounded-2xl p-4 flex items-center gap-4 hover:bg-surface-container/50 transition-colors cursor-pointer group">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center text-on-surface-variant/60 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">history</span>
</div>
<div class="flex-1">
<h3 class="font-stat-label text-stat-label text-on-background">Beachside Loop</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-xs mt-0.5 truncate">32km • Flat</p>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant/40 hover:text-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-[18px]">north_west</span>
</button>
</div>
</div>
</section>
</div>
</main>
<!-- Navigation Shell Suppressed: Task-focused Search Screen -->
</body></html>
