<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - RiderMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container": "#1e2020",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-tertiary": "#303030",

                        "inverse-primary": "#a04100",
                        "surface-dim": "#121414",

                        "on-tertiary-container": "#313131",
                        "surface-container-highest": "#333535",
                        "on-primary-container": "#572000",
                        "tertiary": "#c8c6c5",

                        "on-surface": "#e2e2e2",

<style>
        body {
            background-color: #0A0A0A;
            color: #e2e2e2;
        }
        .glass-card {
            background: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e2e2;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #ff6b00;
            outline: none;
            box-shadow: 0 0 0 1px #ff6b00;
        }
        .primary-btn {
            background: linear-gradient(180deg, #ff8c3a 0%, #ff6b00 100%);
            box-shadow: 0 12px 32px rgba(255, 107, 0, 0.4);
            border-radius: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(255, 107, 0, 0.5);
        }
        .primary-btn:active {
            transform: translateY(0);
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 50%);
            background-size: 100% 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center bg-pattern p-margin-mobile relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute -top-1/4 -right-1/4 w-1/2 h-1/2 bg-primary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-1/2 h-1/2 bg-primary-container/5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Registration Card (Level 1 Surface) -->
<main class="w-full max-w-md">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm font-bold tracking-tight">RiderMate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the ultimate ride-tracking experience.</p>
</div>
<!-- Form Card (Glassmorphic) -->
<div class="glass-card rounded-xl p-lg space-y-lg relative overflow-hidden">
<!-- Subtle internal glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-primary-container/20 blur-sm"></div>
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div class="space-y-xs">
<label class="font-stat-label text-stat-label text-on-surface flex items-center gap-2" for="fullName">
<span class="material-symbols-outlined text-[16px] text-primary">person</span>
                        Full Name
                    </label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md placeholder-on-surface-variant/50" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="font-stat-label text-stat-label text-on-surface flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[16px] text-primary">mail</span>
                        Email Address
                    </label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md placeholder-on-surface-variant/50" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-stat-label text-stat-label text-on-surface flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
                        Password
                    </label>
<div class="relative">
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md placeholder-on-surface-variant/50 pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-xs">
<label class="font-stat-label text-stat-label text-on-surface flex items-center gap-2" for="confirmPassword">
<span class="material-symbols-outlined text-[16px] text-primary">lock_reset</span>
                        Confirm Password
                    </label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md placeholder-on-surface-variant/50" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 py-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-white/10 bg-white/5 text-primary-container focus:ring-primary-container focus:ring-offset-background" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant text-sm" for="terms">
                        I agree to the <a class="text-primary hover:underline underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button (Level 2 Floating) -->
<button class="primary-btn w-full py-3 font-headline-md text-[18px] text-white flex items-center justify-center gap-2 mt-md" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Login Link -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-semibold hover:underline underline-offset-4 transition-all" href="#">Sign in</a>
</p>
</div>
</main>
</body></html>
