<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#ffb693",
                      "inverse-surface": "#e2e2e2",
                      "tertiary-fixed": "#e4e2e1",
                      "secondary": "#c8c6c5",
                      "on-background": "#e2e2e2",
                      "primary-fixed-dim": "#ffb693",
                      "on-tertiary-fixed-variant": "#474746",
                      "surface-variant": "#333535",
                      "surface-container-high": "#282a2b",
                      "tertiary-container": "#9a9999",
                      "surface-bright": "#37393a",
                      "surface-container": "#1e2020",
                      "on-primary-fixed-variant": "#7a3000",
                      "on-tertiary": "#303030",
                      "on-error-container": "#ffdad6",
                      "inverse-primary": "#a04100",
                      "surface-dim": "#121414",
                      "on-surface-variant": "#e2bfb0",
                      "tertiary-fixed-dim": "#c8c6c5",
                      "surface-container-lowest": "#0c0f0f",
                      "on-tertiary-container": "#313131",
                      "surface-container-highest": "#333535",
                      "on-primary-container": "#572000",
                      "tertiary": "#c8c6c5",
                      "secondary-container": "#4a4949",
                      "on-surface": "#e2e2e2",
                      "on-secondary": "#313030",
                      "on-primary-fixed": "#351000",
                      "surface-container-low": "#1a1c1c",
                      "error": "#ffb4ab",
                      "outline": "#a98a7d",
                      "on-error": "#690005",
                      "on-tertiary-fixed": "#1b1c1c",
                      "on-secondary-fixed": "#1c1b1b",
                      "on-secondary-fixed-variant": "#474646",
                      "surface": "#121414",
                      "on-secondary-container": "#bab8b7",
                      "secondary-fixed-dim": "#c8c6c5",
                      "primary-fixed": "#ffdbcc",
                      "on-primary": "#561f00",
                      "background": "#121414",
                      "primary": "#ffb693",
                      "inverse-on-surface": "#2f3131",
                      "primary-container": "#ff6b00",
                      "secondary-fixed": "#e5e2e1",
                      "error-container": "#93000a",
                      "outline-variant": "#5a4136"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter": "16px",
                      "xl": "32px",
                      "margin-mobile": "20px",
                      "lg": "24px",
                      "sm": "8px",
                      "xs": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "stat-label": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "display-stat": [
                              "Hanken Grotesk"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "stat-label": [
                              "14px",
                              {

                                      "fontWeight": "600"

                      ],
                      "label-caps": [
                              "12px",

                                      "letterSpacing": "0.05em",

                      ],
                      "display-stat": [
                              "48px",

                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"

                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }

                      "body-md": [

                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }

              }
      },
          },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/60 backdrop-blur-xl border border-white/20 shadow-[0_4px_20px_rgba(0,0,0,0.05)];
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary-container to-surface-tint;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center relative overflow-hidden text-surface-dim selection:bg-primary/20 selection:text-primary-container">
<!-- Abstract Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-30 z-0">
<svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path class="text-tertiary-container/20" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute inset-0 bg-gradient-to-t from-gray-50 via-transparent to-transparent"></div>
</div>
<!-- Main Splash Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full max-w-md px-margin-mobile">
<!-- Animated Logo Wrapper -->
<div class="mb-xl relative group">
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-2xl group-hover:bg-primary-container/20 transition-all duration-700"></div>
<div class="relative w-32 h-32 flex items-center justify-center glass-panel rounded-full shadow-[0_12px_32px_rgba(255,107,0,0.1)] overflow-hidden">
<!-- Inner kinetic element -->
<div class="absolute inset-0 border-2 border-primary-container/20 rounded-full animate-[spin_8s_linear_infinite] border-t-primary-container"></div>
<div class="absolute inset-2 border border-surface-tint/30 rounded-full animate-[spin_12s_linear_infinite_reverse] border-r-surface-tint"></div>
<span class="material-symbols-outlined text-primary-container text-6xl drop-shadow-md z-10" style="font-variation-settings: 'FILL' 1;">
                    two_wheeler
                </span>
</div>
</div>
<!-- Typography Cluster -->
<div class="text-center mb-xl space-y-sm">
<h1 class="font-headline-lg text-headline-lg text-surface-dim tracking-tight">
                RiderMate
            </h1>
<p class="font-label-caps text-label-caps text-tertiary-container uppercase tracking-[0.2em]">
                Kinetic Precision
            </p>
</div>
<!-- Loading Indicator -->
<div class="w-48 h-1 bg-surface-variant/10 rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-1/3 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite] origin-left shadow-[0_0_10px_rgba(255,107,0,0.5)]"></div>
</div>
</div>
<!-- Bottom Detail (Version/Status) -->
<div class="absolute bottom-8 left-0 w-full text-center z-10">
<p class="font-label-caps text-label-caps text-surface-variant/40">
            v2.4.0 • System Initializing...
        </p>
</div>
</body></html>
