<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live AI Cockpit - RiderMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-surface/60 backdrop-blur-[12px] border border-white/10 shadow-[0_4px_20px_rgba(0,0,0,0.2)];
            }
            .glass-panel-elevated {
                @apply bg-surface/60 backdrop-blur-[20px] border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.4)];
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#313131",
                        "on-secondary-container": "#bab8b7",
                        "secondary": "#c8c6c5",
                        "surface-dim": "#121414",
                        "on-tertiary-fixed-variant": "#474746",
                        "secondary-fixed": "#e5e2e1",
                        "on-background": "#e2e2e2",
                        "on-primary-fixed": "#351000",
                        "background": "#121414",
                        "secondary-container": "#4a4949",
                        "surface-container-highest": "#333535",
                        "surface-variant": "#333535",
                        "inverse-primary": "#a04100",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed": "#1c1b1b",
                        "error-container": "#93000a",
                        "tertiary-container": "#9a9999",
                        "surface-container-lowest": "#0c0f0f",
                        "surface": "#121414",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-bright": "#37393a",
                        "on-tertiary": "#303030",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary": "#313030",
                        "on-error": "#690005",
                        "surface-container-low": "#1a1c1c",
                        "surface-tint": "#ffb693",
                        "primary": "#ffb693",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary": "#c8c6c5",
                        "surface-container-high": "#282a2b",
                        "outline": "#a98a7d",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#e2bfb0",
                        "tertiary-fixed": "#e4e2e1",
                        "on-primary-fixed-variant": "#7a3000",
                        "primary-fixed": "#ffdbcc",
                        "primary-container": "#ff6b00",
                        "on-primary-container": "#572000",
                        "on-tertiary-fixed": "#1b1c1c",
                        "primary-fixed-dim": "#ffb693",
                        "inverse-on-surface": "#2f3131",
                        "on-primary": "#561f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px",
                        "unit": "4px",
                        "xl": "32px",
                        "gutter": "16px",
                        "xs": "4px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "display-stat": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "stat-label": ["Inter"]
                    },
                    "fontSize": {
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen relative overflow-hidden">
<!-- Map Background -->
<div class="absolute inset-0 z-0 bg-surface-dim">
<img class="w-full h-full object-cover opacity-60 mix-blend-screen" data-alt="A highly detailed top-down view of a winding coastal highway map, featuring high-contrast topographic lines and subtle grid patterns overlaying a deep dark gray and black terrain. The aesthetic is premium automotive telemetry, using neon orange routing lines cutting through the dark canvas to signify high performance and precision navigation." data-location="Pacific Coast Highway" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCATvZ4xdDBY86cUWsBapWFVtnhi-LCA_shDEYlKKfBwQ6ztLXlXWo5h_6MCD1FmY7G603_gmADFRUV8DtN_LHXhhHqtGZ0YZxYUONzUnML3_UlXINOPnI2LNY4V-_L1yKg3Skf1Hn_A-jwU-9Vfpw5COaSVqEnU8YcG7U4DK7hkAyViTzcaGCeyjhhbF1NQgWt1Z1hRY5lwBJRYiHuEmCgMEinHDasw-Nk71lZ88zE58b5dCDxpXs80w"/>
</div>
<!-- HUD Overlay -->
<div class="relative z-10 w-full h-screen flex flex-col justify-between p-margin-mobile pb-[100px]">
<!-- Top Instruction Card -->
<div class="w-full max-w-md mx-auto mt-safe-top pt-md">
<div class="glass-panel rounded-xl p-md flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-container flex flex-col items-center justify-center shadow-[0_4px_12px_rgba(255,107,0,0.3)]">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">turn_right</span>
</div>
<div>
<div class="font-label-caps text-label-caps text-primary uppercase">Next Turn · 300m</div>
<div class="font-headline-md text-headline-md text-on-surface mt-xs">Turn Right onto PCH</div>
</div>
</div>
</div>
<!-- Center AI Widget -->
<div class="flex-grow flex items-center justify-center pointer-events-none">
<div class="glass-panel-elevated rounded-full px-lg py-sm flex items-center gap-sm pointer-events-auto">
<div class="relative w-8 h-8 flex items-center justify-center">
<div class="absolute inset-0 rounded-full bg-primary-container animate-ping opacity-20"></div>
<span class="material-symbols-outlined text-primary-container relative z-10" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="font-body-md text-body-md text-on-surface">
                    Watch for gravel on the next hairpin.
                </div>
</div>
</div>
<!-- Bottom Metrics Dashboard -->
<div class="w-full max-w-lg mx-auto grid grid-cols-3 gap-sm mb-lg">
<!-- Speed -->
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">Speed</div>
<div class="font-display-stat text-display-stat text-on-surface flex items-baseline gap-xs">
                    85<span class="font-label-caps text-label-caps text-primary">km/h</span>
</div>
</div>
<!-- Heart Rate -->
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px] text-error" style="font-variation-settings: 'FILL' 1;">favorite</span> Heart Rate
                </div>
<div class="font-display-stat text-display-stat text-on-surface flex items-baseline gap-xs">
                    142<span class="font-label-caps text-label-caps text-error">bpm</span>
</div>
</div>
<!-- Lean Angle -->
<div class="glass-panel rounded-xl p-md flex flex-col items-center justify-center">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs">Lean Angle</div>
<div class="font-display-stat text-display-stat text-on-surface flex items-baseline gap-xs">
                    15<span class="font-label-caps text-label-caps text-secondary">°</span>
</div>
</div>
</div>
<!-- Action Bar -->
<div class="w-full flex justify-between items-end pb-safe-bottom">
<button class="w-12 h-12 rounded-full glass-panel flex flex-col items-center justify-center hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">volume_off</span>
</button>
<button class="w-14 h-14 rounded-full bg-error-container shadow-[0_8px_24px_rgba(147,0,10,0.5)] flex flex-col items-center justify-center hover:opacity-90 transition-opacity">
<span class="font-label-caps text-label-caps text-on-error-container font-bold">SOS</span>
</button>
</div>
</div>
</body></html>
