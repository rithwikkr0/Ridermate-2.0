<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate - Ride Saved</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#e2bfb0",
                        "on-background": "#e2e2e2",
                        "background": "#121414",
                        "on-tertiary-container": "#2f3131",
                        "on-primary-container": "#572000",
                        "glow-orange": "rgba(255, 107, 0, 0.4)",
                        "surface-dim": "#121414",
                        "secondary-fixed": "#e2e2e2",
                        "on-primary": "#561f00",
                        "surface-container-highest": "#333535",
                        "error-container": "#93000a",
                        "border-white-low": "rgba(255, 255, 255, 0.1)",
                        "surface": "#121414",
                        "inverse-primary": "#a04100",
                        "surface-container-lowest": "#0d0e0f",
                        "surface-glass": "rgba(18, 20, 20, 0.6)",
                        "on-tertiary-fixed-variant": "#454747",
                        "primary-fixed": "#ffdbcc",
                        "primary": "#ffb693",
                        "on-secondary-fixed-variant": "#454747",
                        "outline-variant": "#5a4136",
                        "surface-container-low": "#1a1c1c",
                        "on-tertiary-fixed": "#1a1c1c",
                        "surface-variant": "#333535",
                        "inverse-on-surface": "#2f3131",
                        "outline": "#a98a7d",
                        "primary-fixed-dim": "#ffb693",
                        "secondary-container": "#454747",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#282a2b",
                        "background-deep": "#0A0A0A",
                        "tertiary-container": "#989999",
                        "on-secondary-fixed": "#1a1c1c",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "primary-container": "#ff6b00",
                        "secondary": "#c6c6c6",
                        "surface-tint": "#ffb693",
                        "on-secondary": "#2f3131",
                        "on-tertiary": "#2f3131",
                        "tertiary": "#c6c6c6",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-error": "#690005",
                        "on-secondary-container": "#b5b5b5",
                        "on-primary-fixed-variant": "#7a3000",
                        "error": "#ffb4ab",
                        "surface-glass-elevated": "rgba(18, 20, 20, 0.7)",
                        "on-primary-fixed": "#351000",
                        "on-surface": "#e2e2e2",
                        "surface-container": "#1e2020",
                        "inverse-surface": "#e2e2e2",
                        "surface-bright": "#38393a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "display-stat": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "stat-label": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-pulse {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 20px rgba(255, 107, 0, 0.4); }
            50% { opacity: .8; transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 107, 0, 0.8); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-deep text-on-surface min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- Neural Gradient Background -->
<div class="absolute inset-0 z-0 pointer-events-none" style="background: radial-gradient(circle at 50% -20%, rgba(255, 107, 0, 0.15) 0%, transparent 60%);"></div>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[672px] mx-auto px-margin-mobile flex flex-col items-center justify-center relative z-10 py-xl min-h-screen">
<!-- Success Animation Placeholder -->
<div class="relative w-32 h-32 mb-xl">
<div class="absolute inset-0 rounded-full bg-primary-container/20 glow-pulse"></div>
<div class="absolute inset-2 rounded-full bg-primary-container/40 flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    done
                </span>
</div>
</div>
<!-- Typography -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Ride Captured</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                Your 142km journey through Stelvio Pass is now part of your legend.
            </p>
</div>
<!-- Summary Card (Bento Grid) -->
<div class="w-full glass-panel bg-surface-glass rounded-xl p-md mb-xl flex flex-col gap-md">
<div class="border-b border-border-white-low pb-sm">
<h2 class="font-label-caps text-label-caps text-primary uppercase tracking-widest">Session Summary</h2>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-md">
<!-- Stat: Distance -->
<div class="flex flex-col gap-unit">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">route</span>
                        Distance
                    </span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">142.4</span>
<span class="font-stat-label text-stat-label text-on-surface-variant">km</span>
</div>
</div>
<!-- Stat: Time -->
<div class="flex flex-col gap-unit">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">timer</span>
                        Time
                    </span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">5:24</span>
<span class="font-stat-label text-stat-label text-on-surface-variant">h</span>
</div>
</div>
<!-- Stat: Top Speed (Spans 2 cols on mobile, 1 on md) -->
<div class="flex flex-col gap-unit col-span-2 md:col-span-1">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">speed</span>
                        Top Speed
                    </span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-md text-headline-md text-on-surface">68.2</span>
<span class="font-stat-label text-stat-label text-on-surface-variant">km/h</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-[18px] py-md rounded-full shadow-[0_0_15px_rgba(255,107,0,0.3)] hover:shadow-[0_0_25px_rgba(255,107,0,0.5)] transition-all active:scale-95 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios_share</span>
                Share Story
            </button>
<button class="w-full glass-panel bg-surface-glass-elevated text-on-surface font-body-md text-body-md py-md rounded-full hover:bg-white/5 transition-colors active:scale-95 flex items-center justify-center gap-sm">
                Back to Journal
            </button>
</div>
</main>
</body></html>
