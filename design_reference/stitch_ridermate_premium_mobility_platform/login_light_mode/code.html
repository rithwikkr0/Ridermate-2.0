<style>
        /* Light Mode Overrides for Elegant White */
        .light body {
            background-color: #FAFAFA; /* Soft white background */
            color: #121414;
        }
        
        .glass-card-light {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0px 12px 32px rgba(0, 0, 0, 0.05);
        }

        .glass-input-light {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input-light:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #ff6b00;
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.2);
            outline: none;
        }

        .btn-primary-gradient {
            background: linear-gradient(180deg, #ff8a33 0%, #ff6b00 100%);
            box-shadow: 0px 4px 12px rgba(255, 107, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary-gradient:active {
            transform: scale(0.98);
            box-shadow: 0px 2px 6px rgba(255, 107, 0, 0.3);
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.05) 0%, rgba(250, 250, 250, 0) 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: -1;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen relative overflow-hidden flex flex-col antialiased">
<!-- Ambient Background Glow -->
<div class="ambient-glow"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile relative z-10 w-full h-full">
<!-- Login Card (Glassmorphic) -->
<div class="glass-card-light rounded-3xl p-xl w-full max-w-md flex flex-col gap-lg z-20">
<!-- Header -->
<div class="flex flex-col items-center gap-sm text-center">
<!-- Abstract Logo Element -->
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center mb-sm shadow-sm border border-primary-container/20">
<span class="material-symbols-outlined text-[32px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                        speed
                    </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-surface-container-lowest tracking-tight">RiderMate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Kinetic precision. Welcome back.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md mt-sm" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs relative group">
<label class="font-label-caps text-label-caps text-surface-container-highest ml-sm" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">
                            mail
                        </span>
<input class="glass-input-light w-full rounded-2xl py-3 pl-12 pr-4 font-body-md text-surface-container-lowest placeholder:text-on-surface-variant/50 focus:ring-0" id="email" placeholder="rider@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs relative group mt-sm">
<label class="font-label-caps text-label-caps text-surface-container-highest ml-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">
                            lock
                        </span>
<input class="glass-input-light w-full rounded-2xl py-3 pl-12 pr-12 font-body-md text-surface-container-lowest placeholder:text-on-surface-variant/50 focus:ring-0" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-surface-container-lowest transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                                visibility_off
                            </span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex justify-between items-center mt-xs px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5">
<input class="peer appearance-none w-5 h-5 border border-on-surface-variant/30 rounded bg-white/50 checked:bg-primary-container checked:border-primary-container focus:ring-0 focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">
                                check
                            </span>
</div>
<span class="font-stat-label text-stat-label text-surface-container-highest group-hover:text-surface-container-lowest transition-colors">Remember me</span>
</label>
<a class="font-stat-label text-stat-label text-primary-container hover:text-surface-container-lowest transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="btn-primary-gradient w-full rounded-full py-4 mt-lg font-headline-md text-headline-md text-white flex justify-center items-center gap-2" type="submit">
                    Start Engine
                    <span class="material-symbols-outlined text-[20px]">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full mt-sm">
<div class="h-px bg-on-surface-variant/20 flex-grow"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant/60">OR CONTINUE WITH</span>
<div class="h-px bg-on-surface-variant/20 flex-grow"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4 mt-sm">
<button class="flex-1 glass-input-light rounded-2xl py-3 flex justify-center items-center hover:bg-white transition-colors" type="button">
<svg class="w-5 h-5 text-surface-container-lowest" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 glass-input-light rounded-2xl py-3 flex justify-center items-center hover:bg-white transition-colors" type="button">
<svg class="w-5 h-5 text-surface-container-lowest" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-.8 1.49.07 2.81.74 3.67 1.83-3.1 1.77-2.58 5.8.31 6.88-1.09 2.58-1.57 2.89-2.56 4.26M12.03 7.22c-.15-2.92 2.35-5.26 5.16-5.22.25 3.01-2.68 5.39-5.16 5.22"></path>
</svg>
</button>
</div>
<div class="text-center mt-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Don't have an account?</span>
<a class="font-stat-label text-stat-label text-primary-container hover:text-surface-container-lowest transition-colors ml-1" href="#">Sign up</a>
</div>
</div>
</main>
<!-- Decorative Bottom Graphic (Subtle) -->
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-black/5 to-transparent z-0 pointer-events-none"></div>
</body></html>
