<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export &amp; Share Statistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#e2e2e2",
                        "primary": "#ffb693",
                        "surface-tint": "#ffb693",
                        "on-surface-variant": "#e2bfb0",
                        "background": "#121414",
                        "on-secondary-fixed-variant": "#474646",
                        "primary-fixed-dim": "#ffb693",
                        "tertiary": "#c8c6c5",
                        "on-primary": "#561f00",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary-container": "#313131",
                        "surface-dim": "#121414",
                        "on-secondary-container": "#bab8b7",
                        "inverse-surface": "#e2e2e2",
                        "inverse-primary": "#a04100",
                        "primary-fixed": "#ffdbcc",
                        "error": "#ffb4ab",
                        "surface-container": "#1e2020",
                        "on-primary-container": "#572000",
                        "surface-container-low": "#1a1c1c",
                        "on-primary-fixed": "#351000",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-container-highest": "#333535",
                        "tertiary-container": "#9a9999",
                        "on-tertiary-fixed-variant": "#474746",
                        "error-container": "#93000a",
                        "surface-container-high": "#282a2b",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#5a4136",
                        "on-background": "#e2e2e2",
                        "surface": "#121414",
                        "secondary": "#c8c6c5",
                        "surface-container-lowest": "#0c0f0f",
                        "on-error": "#690005",
                        "outline": "#a98a7d",
                        "secondary-container": "#4a4949",
                        "inverse-on-surface": "#2f3131",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-variant": "#333535",
                        "surface-bright": "#37393a",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-tertiary-fixed": "#1b1c1c",
                        "on-tertiary": "#303030",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#ff6b00",
                        "on-secondary": "#313030"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "stat-label": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-stat": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background-color: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
        }
        .glow-shadow {
            box-shadow: 0px 12px 32px rgba(255, 107, 0, 0.05);
        }
        .button-primary {
            background: linear-gradient(180deg, #ffb693 0%, #ff6b00 100%);
            box-shadow: 0px 4px 15px rgba(255, 107, 0, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen relative pb-[100px]">
<!-- Background Layer -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-high/50 via-background to-background"></div>
</div>
<!-- Top Navigation (Shell suppressed for focused task, using custom back header) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/60 backdrop-blur-xl border-b border-white/10">
<button class="text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Export &amp; Share</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 pt-[80px] px-margin-mobile flex flex-col gap-gutter md:max-w-2xl md:mx-auto">
<!-- Preview Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Preview</h2>
<!-- The Recap Card -->
<div class="glass-card rounded-xl overflow-hidden glow-shadow flex flex-col">
<!-- Map / Hero Image Area -->
<div class="h-48 relative w-full bg-surface-container-highest">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A stylized, dark-themed 3D topographic map showing a winding mountain road. The route is highlighted with a glowing neon orange line, characteristic of the 'Circuit Orange' brand color. The terrain is rendered in deep charcoals and blacks with subtle glassmorphic reflections. High-end, precise telemetry visual style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDf66rNqWhgnZLwIOW8IkJxqjOJ8bNPKrQcR6gUUNWyYjeQhIcYeamEpaljFm65HBYJfdLOjIT7J_D30fObeq86xTvBMkRE1OV1pMv3SZT74xQejH3Z1ZVXD2vYhn3kcxHzucpG1iTK8sSXy3dyiaght7qVm-z16AqHP7irsNU9vecLUcMEt-vC1k5YffQMZOeschQtp76sos8rpwpBnIqwepv2nJ3hbOoYbBQouLoMDbtGy7uuiEhBAw')"></div>
<!-- Overlay Gradient for text readability -->
<div class="absolute inset-0 bg-gradient-to-t from-background/90 to-transparent"></div>
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
<div>
<p class="font-label-caps text-label-caps text-primary mb-1">Season 2024</p>
<h3 class="font-headline-md text-headline-md text-on-surface">Epic Rides</h3>
</div>
<div class="h-10 w-10 bg-primary/20 backdrop-blur-md rounded-full border border-primary/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">pedal_bike</span>
</div>
</div>
</div>
<!-- Stats Area -->
<div class="p-4 grid grid-cols-2 gap-4 bg-surface-container/50 backdrop-blur-md">
<div class="flex flex-col bg-surface-container-low/50 p-3 rounded-lg border border-white/5">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Total Distance</span>
<span class="font-display-stat text-headline-md text-on-surface">3,240 <span class="text-sm font-normal text-on-surface-variant">km</span></span>
</div>
<div class="flex flex-col bg-surface-container-low/50 p-3 rounded-lg border border-white/5">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Elevation Gain</span>
<span class="font-display-stat text-headline-md text-on-surface">45,120 <span class="text-sm font-normal text-on-surface-variant">m</span></span>
</div>
<div class="flex flex-col bg-surface-container-low/50 p-3 rounded-lg border border-white/5">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Top Speed</span>
<span class="font-display-stat text-headline-md text-on-surface">72.4 <span class="text-sm font-normal text-on-surface-variant">km/h</span></span>
</div>
<div class="flex flex-col bg-surface-container-low/50 p-3 rounded-lg border border-white/5">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Active Time</span>
<span class="font-display-stat text-headline-md text-on-surface">142 <span class="text-sm font-normal text-on-surface-variant">hrs</span></span>
</div>
</div>
</div>
<p class="font-body-md text-sm text-center text-on-surface-variant mt-2">This image will be generated for sharing.</p>
</section>
<!-- Export Options -->
<section class="flex flex-col gap-sm mt-4">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Export Data</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<button class="glass-card p-4 rounded-lg flex items-center gap-3 hover:bg-surface-container transition-colors group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">description</span>
</div>
<div class="text-left">
<span class="block font-stat-label text-stat-label text-on-surface">PDF Report</span>
<span class="block font-label-caps text-label-caps text-on-surface-variant">Print-ready summary</span>
</div>
</button>
<button class="glass-card p-4 rounded-lg flex items-center gap-3 hover:bg-surface-container transition-colors group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">route</span>
</div>
<div class="text-left">
<span class="block font-stat-label text-stat-label text-on-surface">GPX Data</span>
<span class="block font-label-caps text-label-caps text-on-surface-variant">Raw route paths</span>
</div>
</button>
<button class="glass-card p-4 rounded-lg flex items-center gap-3 hover:bg-surface-container transition-colors group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">dataset</span>
</div>
<div class="text-left">
<span class="block font-stat-label text-stat-label text-on-surface">CSV Export</span>
<span class="block font-label-caps text-label-caps text-on-surface-variant">Spreadsheet metrics</span>
</div>
</button>
</div>
</section>
</main>
<!-- Floating Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-gradient-to-t from-background via-background to-transparent z-40">
<button class="w-full button-primary text-on-primary font-headline-md text-lg rounded-full py-4 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">share</span>
            Share Season Recap
        </button>
</div>
</body></html>
