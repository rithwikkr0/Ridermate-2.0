<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate - Analytics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                    "colors": {
                        "on-primary-container": "#572000",
                        "primary": "#ffb693",
                        "inverse-on-surface": "#2f3131",

                        "surface-bright": "#37393a",
                        "tertiary-container": "#9a9999",
                        "outline": "#a98a7d",
                        "tertiary-fixed-dim": "#c8c6c5",

                        "on-surface": "#e2e2e2",
                        "surface-container-low": "#1a1c1c",
                        "on-primary-fixed-variant": "#7a3000",
                        "inverse-primary": "#a04100",
                        "on-error-container": "#ffdad6",
                        "on-background": "#e2e2e2",
                        "surface-tint": "#ffb693",
                        "primary-container": "#ff6b00",
                        "error-container": "#93000a",
                        "on-surface-variant": "#e2bfb0",
                        "on-primary": "#561f00",
                        "surface": "#121414",

                        "surface-variant": "#333535",
                        "primary-fixed": "#ffdbcc",
                        "secondary-fixed-dim": "#c8c6c5",
                        "secondary": "#c8c6c5",
                        "surface-container-highest": "#333535",
                        "surface-dim": "#121414",
                        "on-tertiary-container": "#313131",

                        "on-primary-fixed": "#351000",
                        "secondary-container": "#4a4949",
                        "tertiary": "#c8c6c5",
                        "surface-container-high": "#282a2b",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary-fixed": "#1b1c1c",
                        "on-secondary": "#313030",
                        "on-tertiary-fixed-variant": "#474746",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-container": "#1e2020",
                        "outline-variant": "#5a4136",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "md": "16px",
                        "unit": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "stat-label": ["Inter"],
                        "display-stat": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }

<style>
        body { background-color: #0A0A0A; color: #e2e2e2; }
        .glass-card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-gradient {
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-3xl border-b border-white/10 shadow-sm flex justify-between items-center px-margin-mobile py-md">
<div class="flex items-center gap-sm scale-95 active:scale-90 transition-transform">
<img class="w-10 h-10 rounded-full object-cover border border-white/10" data-alt="A sleek, high-contrast user avatar profile picture. The lighting is cinematic and moody, fitting a premium dark mode UI. The subject is partially obscured by shadows, emphasizing a futuristic, minimalist athletic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdibnmyrsxoUZQvwXAVXiBX5ZjMBlUztx5nrC7Kvj55DjJuAQTkpjrmNO7wILhJpYGFkCZPK7eMTbmqn8a3XOJr-iigof1xcSv3SPn8zS9g0Qj_PdQ8gp-akRXKiCxB3y0XxKQ3BtbvPET95tvl3lTNNQfeu9fXlIwTmBnbFeUfzq8lH-pjA80HAscCpp_aEjwMJNtDbp26yMcab50ntCnuJ_gdPIhfzeTyWHaB0i13ZwXpE8N7iPKkA"/>
</div>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary">RiderMate</h1>
<button class="scale-95 active:scale-90 transition-transform text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="pt-[90px] px-margin-mobile">
<!-- Tabs -->
<div class="flex gap-4 overflow-x-auto pb-4 scrollbar-hide -mx-margin-mobile px-margin-mobile mb-6">
<button class="px-6 py-2 rounded-full border border-white/10 text-on-surface-variant font-label-caps text-label-caps whitespace-nowrap hover:bg-white/5 transition-colors">Daily</button>
<button class="px-6 py-2 rounded-full bg-primary-container text-white font-label-caps text-label-caps whitespace-nowrap shadow-[0_4px_20px_rgba(255,107,0,0.2)] border border-primary-container/50">Weekly</button>
<button class="px-6 py-2 rounded-full border border-white/10 text-on-surface-variant font-label-caps text-label-caps whitespace-nowrap hover:bg-white/5 transition-colors">Monthly</button>
<button class="px-6 py-2 rounded-full border border-white/10 text-on-surface-variant font-label-caps text-label-caps whitespace-nowrap hover:bg-white/5 transition-colors">Heatmaps</button>
</div>
<!-- Hero Chart -->
<section class="glass-card rounded-3xl p-6 mb-gutter shadow-[0_4px_20px_rgba(0,0,0,0.4)] relative overflow-hidden">
<div class="flex justify-between items-end mb-8">
<div>
<h2 class="font-stat-label text-stat-label text-on-surface-variant mb-1">WEEKLY DISTANCE</h2>
<div class="font-display-stat text-display-stat text-gradient">342<span class="text-headline-md opacity-50 ml-1">km</span></div>
</div>
<div class="flex items-center gap-1 text-primary">
<span class="material-symbols-outlined text-sm">trending_up</span>
<span class="font-label-caps text-label-caps">+12%</span>
</div>
</div>
<!-- Fake Chart SVG -->
<div class="h-48 w-full relative">
<svg class="w-full h-full overflow-visible" preserveaspectratio="none" viewbox="0 0 400 150">
<defs>
<lineargradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ff6b00" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#ff6b00" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0,150 L0,120 C50,110 80,140 130,90 C180,40 220,100 270,70 C320,40 360,20 400,30 L400,150 Z" fill="url(#chartGradient)"></path>
<path d="M0,120 C50,110 80,140 130,90 C180,40 220,100 270,70 C320,40 360,20 400,30" fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-width="3"></path>
<!-- Data Points -->
<circle cx="130" cy="90" fill="#121414" r="5" stroke="#ff6b00" stroke-width="2"></circle>
<circle cx="270" cy="70" fill="#121414" r="5" stroke="#ff6b00" stroke-width="2"></circle>
<circle class="animate-pulse shadow-[0_0_10px_#ff6b00]" cx="400" cy="30" fill="#ff6b00" r="6"></circle>
</svg>
<!-- Tooltip -->
<div class="absolute top-[10px] right-[10px] glass-card px-3 py-2 rounded-lg transform translate-x-1/2 -translate-y-full shadow-[0_12px_32px_rgba(0,0,0,0.5)] flex flex-col items-center">
<span class="font-stat-label text-stat-label text-white">Sunday</span>
<span class="font-label-caps text-label-caps text-primary">84km</span>
</div>
</div>
<div class="flex justify-between mt-4 font-label-caps text-label-caps text-on-surface-variant/50 px-2">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span class="text-primary">S</span>
</div>
</section>
<!-- Stats Grid (Bento) -->
<section class="grid grid-cols-2 gap-gutter mb-gutter">
<div class="glass-card rounded-2xl p-5 flex flex-col justify-between aspect-square">
<span class="material-symbols-outlined text-on-surface-variant mb-4">speed</span>
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-1">AVG POWER</h3>
<div class="font-headline-lg text-headline-lg text-white">215<span class="text-sm opacity-50 ml-1">W</span></div>
</div>
</div>
<div class="glass-card rounded-2xl p-5 flex flex-col justify-between aspect-square bg-surface-container-low/80">
<span class="material-symbols-outlined text-primary mb-4">terrain</span>
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-1">TOTAL ELEV</h3>
<div class="font-headline-lg text-headline-lg text-white">12.4<span class="text-sm opacity-50 ml-1">km</span></div>
</div>
</div>
<div class="glass-card rounded-2xl p-5 col-span-2 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
<span class="material-symbols-outlined text-primary">emoji_events</span>
</div>
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant">PERSONAL RECORDS</h3>
<div class="font-headline-md text-headline-md text-white">3 <span class="font-body-md text-body-md text-on-surface-variant ml-2 font-normal">This Week</span></div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</section>
<!-- Recent PB Card -->
<section class="glass-card rounded-3xl p-6 relative overflow-hidden mb-8">
<div class="absolute inset-0 opacity-20 pointer-events-none" data-alt="Abstract topographic map lines glowing subtly in dark orange and grey hues. The design mimics high-tech cycling telemetry data visualization, creating a sense of elevation and intense performance within a premium dark mode interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD7J7ZVwFjCCwi5V0H_NC8OvcDR-k0jJVCnXn89eaiQry_t48y0IpTmG4l8nW3BgnCnrHC1IW6HWozETuv3csxUkrakfAZdqLSHiZh12mioOasvdnw61hI3h_oH6FHC6xpBrWLJidsxq9eaq67C__8YPCEmIRsMcBwvOcK-85z2ihuyJt_95chnkjv1xsdG0YLF7e19LH4K6vACJ5Pin9dICVS-8QpOGmIloIo8OwPl1fThH7r2P0k-_Q'); background-size: cover; background-position: center;"></div>
<div class="relative z-10">
<div class="flex items-center gap-2 mb-4">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<h3 class="font-stat-label text-stat-label text-on-surface-variant uppercase tracking-wider">Recent Personal Best</h3>
</div>
<h4 class="font-headline-md text-headline-md text-white mb-2">Col de la Madone</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 mb-6">You beat your previous time by 1m 24s.</p>
<div class="flex gap-4">
<div class="bg-surface/50 rounded-lg px-4 py-2 border border-white/5">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-1">TIME</span>
<span class="font-stat-label text-stat-label text-white">45:12</span>
</div>
<div class="bg-surface/50 rounded-lg px-4 py-2 border border-white/5">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-1">VAM</span>
<span class="font-stat-label text-stat-label text-white">1250</span>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-margin-mobile right-margin-mobile z-50 flex justify-around items-center py-sm bg-surface-container/60 dark:bg-surface-container/60 backdrop-blur-[30px] rounded-full border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.4)] md:hidden">
<button class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1">explore</span>
<span class="font-label-caps text-label-caps">Nav</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1">psychology</span>
<span class="font-label-caps text-label-caps">Coach</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-bold bg-primary/10 rounded-full px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-caps text-label-caps">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</nav>
</body></html>
