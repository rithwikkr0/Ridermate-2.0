<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Navigation - RiderMate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Hanken+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-fixed-dim": "#ffb693",
                        "primary-container": "#ff6b00",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-variant": "#333535",
                        "on-error": "#690005",
                        "surface-tint": "#ffb693",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#1b1c1c",
                        "tertiary-container": "#9a9999",
                        "on-tertiary-container": "#313131",
                        "on-primary-fixed": "#351000",
                        "surface-dim": "#121414",
                        "on-tertiary": "#303030",
                        "error-container": "#93000a",
                        "surface-bright": "#37393a",
                        "on-surface": "#e2e2e2",
                        "surface": "#121414",
                        "on-secondary-container": "#bab8b7",
                        "inverse-on-surface": "#2f3131",
                        "on-secondary-fixed": "#1c1b1b",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-highest": "#333535",
                        "on-primary": "#561f00",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-container": "#572000",
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#7a3000",
                        "surface-container-high": "#282a2b",
                        "tertiary": "#c8c6c5",
                        "on-secondary": "#313030",
                        "on-surface-variant": "#e2bfb0",
                        "on-background": "#e2e2e2",
                        "inverse-primary": "#a04100",
                        "outline": "#a98a7d",
                        "surface-container": "#1e2020",
                        "secondary-container": "#4a4949",
                        "primary": "#ffb693",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-container-low": "#1a1c1c",
                        "background": "#121414",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-container-lowest": "#0c0f0f",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "primary-fixed": "#ffdbcc",
                        "secondary": "#c8c6c5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "md": "16px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display-stat": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "stat-label": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Light mode specific overrides for this page since the theme config defaults to dark mode colors */
        .light body {
            background-color: #f8f9fa; /* Light background */
            color: #1c1b1b; /* Dark text */
        }
        .light .bg-surface-light { background-color: #ffffff; }
        .light .text-on-surface-light { color: #1c1b1b; }
        .light .border-surface-light { border-color: rgba(0,0,0,0.1); }
        .light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .light .glass-panel-elevated {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased overflow-hidden h-screen w-screen relative">
<!-- Full Screen Map Background -->
<div class="map-container" data-alt="A bright, high-contrast, light-mode digital map interface. The map shows winding roads through a mountainous or scenic area, rendered in clean, minimal vectors with white and pale gray terrain, punctuated by a vivid orange route line. The aesthetic is modern, premium, and designed for outdoor visibility under sunlight." data-location="San Bernardino Pass" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCUEk9mXp3Ghwt4kV6tWH3spaVHIPVtquhmnmaRp_xkGCHz5A8viV28Sq_el8MmAghLF1g94k-eeszQHiSKS77dRO6WSXFUlyRrAUoioS0m6HBVOcx1Anx5_cJGQZiyNKy73Xa205e9UTkXxJwojXgoZDWyNPK6HGUpn3vKdHGt0pvgwD1JjXdw8pscVESn44uRPfRi3GVdvQSW--uONNIQDEH9FvNBKQFZK3iAZ6OClN0a0oMFGS948w')">
<!-- Overlay to ensure readability if map is too complex -->
<div class="absolute inset-0 bg-white/10"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-10 h-full w-full flex flex-col justify-between pointer-events-none p-margin-mobile">
<!-- Top Section: Turn-by-turn Navigation Card -->
<div class="w-full max-w-md mx-auto pointer-events-auto">
<div class="glass-panel-elevated rounded-xl p-md flex items-center gap-md mt-safe-top">
<div class="bg-primary-container text-white p-sm rounded-lg flex-shrink-0 shadow-[0_4px_12px_rgba(255,107,0,0.3)]">
<span class="material-symbols-outlined text-4xl" data-icon="turn_right" style="font-variation-settings: 'FILL' 1;">turn_right</span>
</div>
<div class="flex-grow">
<div class="font-display-stat text-display-stat text-on-surface-light leading-none tracking-tight">
                        300<span class="text-headline-md font-headline-md text-on-surface-variant ml-1">m</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface-light mt-1">
                        Via San Bernardino
                    </div>
</div>
<div class="flex flex-col gap-sm">
<button class="bg-surface-light rounded-full p-2 shadow-sm border border-surface-light text-on-surface-light hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
<button class="bg-surface-light rounded-full p-2 shadow-sm border border-surface-light text-on-surface-light hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
</div>
<!-- Floating Action Buttons (Right Side) -->
<div class="absolute right-margin-mobile bottom-[300px] flex flex-col gap-md pointer-events-auto">
<button class="glass-panel rounded-full w-12 h-12 flex items-center justify-center text-on-surface-light hover:bg-white/90 transition-colors">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
<div class="glass-panel rounded-full flex flex-col overflow-hidden">
<button class="w-12 h-12 flex items-center justify-center text-on-surface-light hover:bg-white/90 transition-colors border-b border-surface-light">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-12 h-12 flex items-center justify-center text-on-surface-light hover:bg-white/90 transition-colors">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
</div>
</div>
<!-- Bottom Section: Telemetry / Metrics Card -->
<div class="w-full pointer-events-auto pb-4">
<div class="glass-panel-elevated rounded-t-xl rounded-b-xl overflow-hidden shadow-[0_-8px_32px_rgba(0,0,0,0.05)]">
<!-- Main Metrics Grid -->
<div class="grid grid-cols-3 divide-x divide-black/5 p-lg">
<!-- Speed -->
<div class="flex flex-col items-center justify-center px-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Speed</span>
<div class="flex items-baseline mt-1">
<span class="font-display-stat text-display-stat text-on-surface-light">45</span>
<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">km/h</span>
</div>
</div>
<!-- Distance Left -->
<div class="flex flex-col items-center justify-center px-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Dist Left</span>
<div class="flex items-baseline mt-1">
<span class="font-headline-lg text-headline-lg text-on-surface-light">8.2</span>
<span class="font-stat-label text-stat-label text-on-surface-variant ml-1">km</span>
</div>
</div>
<!-- ETA -->
<div class="flex flex-col items-center justify-center px-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">ETA</span>
<div class="flex items-baseline mt-1">
<span class="font-headline-lg text-headline-lg text-on-surface-light">14:32</span>
</div>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="bg-white/60 border-t border-black/5 p-md flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-primary-container"></span>
</span>
<span class="font-stat-label text-stat-label text-on-surface-light">Recording</span>
</div>
<button class="bg-error text-on-error px-lg py-2 rounded-full font-stat-label text-stat-label shadow-sm hover:bg-error/90 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="stop">stop</span> End Ride
                    </button>
</div>
</div>
</div>
</div>
</body></html>
