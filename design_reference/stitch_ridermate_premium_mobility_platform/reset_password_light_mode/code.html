            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-primary {
            background: linear-gradient(180deg, theme('colors.primary-container') 0%, theme('colors.primary-container') 100%);

<body class="antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-md bg-surface/60 backdrop-blur-3xl border-b border-white/10 shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">speed</span>
<span class="font-headline-lg text-headline-lg font-bold text-primary">RiderMate</span>
</div>
</header>
<main class="w-full max-w-md mt-24 z-10">
<div class="glass-card rounded-[32px] p-lg flex flex-col gap-xl">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter a new secure password for your RiderMate account.</p>
</div>
<form class="flex flex-col gap-lg">
<div class="flex flex-col gap-2">
<label class="font-stat-label text-stat-label text-on-surface" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="new-password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-stat-label text-stat-label text-on-surface" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Security Checklist -->
<div class="bg-surface-container-low rounded-xl p-md border border-white/5">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-4 tracking-wider">PASSWORD REQUIREMENTS</h3>
<ul class="flex flex-col gap-3">
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-lg">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">At least 8 characters long</span>
</li>
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-lg">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface-variant">Contains a number or symbol</span>
</li>
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-lg">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface-variant">Contains uppercase &amp; lowercase</span>
</li>
</ul>
</div>
<button class="btn-primary w-full py-4 rounded-full font-stat-label text-stat-label text-white hover:opacity-90 active:scale-95 transition-all mt-4 flex items-center justify-center gap-2" type="button">
                    Update Password
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="text-center mt-2">
<a class="font-stat-label text-stat-label text-primary hover:text-primary-fixed transition-colors" href="#">Back to Login</a>
</div>
</div>
</main>
<!-- BottomNavBar is suppressed due to transactional intent (Reset Password) -->
