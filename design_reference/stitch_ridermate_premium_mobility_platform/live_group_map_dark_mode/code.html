<style>
        .glass-panel {
            background-color: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .shadow-elevation-2 {
            box-shadow: 0 12px 32px rgba(255, 107, 0, 0.15);
        }
        
        /* Map Marker Pulsing */
        @keyframes pulse-marker {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 107, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
        }
        .marker-pulse {
            animation: pulse-marker 2s infinite;
        }

        /* Animated Route Line */
        .route-path {
            stroke-dasharray: 10;
            animation: dash 20s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }
    </style>
<style>

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative font-body-md">

<path class="route-path opacity-50" d="M 200,800 Q 300,600 500,500 T 800,200" fill="none" stroke="#ffb693" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<path class="route-path" d="M 200,800 Q 300,600 500,500 T 800,200" fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Map Markers -->
<!-- User Marker -->

<div class="relative">
<div class="w-6 h-6 bg-primary-container rounded-full border-2 border-background flex items-center justify-center marker-pulse">

</div>

<!-- Script for subtle map marker movement simulation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const leaderMarker = document.getElementById('marker-friend-1');
            
            // Subtle random movement for the leader marker to simulate active tracking
            setInterval(() => {
                if(!leaderMarker) return;
                
                // Base position roughly 30% top, 70% left
                const baseTop = 30;
                const baseLeft = 70;
                
                // Random variation +/- 2%
                const varTop = (Math.random() - 0.5) * 4;
                const varLeft = (Math.random() - 0.5) * 4;
                
                leaderMarker.style.top = `${baseTop + varTop}%`;
                leaderMarker.style.left = `${baseLeft + varLeft}%`;
                
            }, 3000);
        });
    </script>
