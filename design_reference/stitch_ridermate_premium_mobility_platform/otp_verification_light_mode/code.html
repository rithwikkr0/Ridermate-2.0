<style>

<p class="font-body-md text-body-md text-surface-variant text-center mb-lg">
                We've sent a kinetic precision code to your device. Enter it below to ignite your session.
            </p>
<div class="flex gap-sm justify-center mb-lg" id="otp-container">
<input autofocus="" class="light-otp-input" maxlength="1" type="text"/>
<input class="light-otp-input" maxlength="1" type="text"/>
<input class="light-otp-input" maxlength="1" type="text"/>
<input class="light-otp-input" maxlength="1" type="text"/>
<input class="light-otp-input" maxlength="1" type="text"/>
<input class="light-otp-input" maxlength="1" type="text"/>

<script>
        const inputs = document.querySelectorAll('.light-otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
