<style>
        body {
            background-color: #0A0A0A;
            color: #e2e2e2;
        }
        
        .glass-card {
            background: rgba(30, 32, 32, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(255, 107, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .glass-input:focus {
            border-color: #ff6b00;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff8533 0%, #ff6b00 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(255, 107, 0, 0.3);
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }
        
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,107,0,0.15) 0%, rgba(10,10,10,0) 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen relative overflow-hidden flex items-center justify-center p-margin-mobile">
<!-- Background Elements -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-[url('placeholder')] bg-cover bg-center opacity-30" data-alt="A moody, high-contrast photograph of a sleek carbon-fiber road bike wheel and gearing mechanism, taken in a dimly lit studio with a single intense spotlight highlighting the precision engineering. The overall tone is dark, technical, and premium, utilizing deep blacks, charcoal greys, and subtle hints of warm metallic reflections to convey a sense of high-performance machinery." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBFPv-kewQ_09Z9yK1r0MxyaRzZgHKlv-M_tRaXyjHjl3hRcLmkyzQAgvwqIkZr3-lrD6rLnsVvf166o7XZjVTcYrOHWvF_9R_2kzOlJokSyWeTHxUM8aj1vzi7WhM3q_yySRq5ent9hzm-r8wijJ6DopVNB8fayXmk3djOViw8ZunBLyHL0pM8XZhvzmR7N92FS_BCcINn2EWfhAfVeNLdPX5lnEjnPz0SQ7VrbvRZY6EKGQEhonyP3A')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
<div class="bg-glow"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-white mb-sm tracking-tight">RiderMate</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your performance cockpit.</p>
</div>
<!-- Glassmorphic Card -->
<div class="glass-card rounded-xl p-lg space-y-lg relative overflow-hidden">
<!-- Subtle internal glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-primary-container/30 to-transparent blur-sm"></div>
<form class="space-y-md">
<!-- Email Input -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant/60">mail</span>
<input class="glass-input w-full rounded-lg py-sm pl-[40px] pr-sm text-white font-body-md text-body-md transition-all duration-200 placeholder:text-on-surface-variant/40" id="email" placeholder="rider@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant/60">lock</span>
<input class="glass-input w-full rounded-lg py-sm pl-[40px] pr-sm text-white font-body-md text-body-md transition-all duration-200 placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Login Action -->
<button class="btn-primary w-full rounded-full py-md text-white font-stat-label text-stat-label tracking-wide uppercase mt-lg transition-transform active:scale-95 hover:brightness-110" type="button">
                    Initialize Login
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-sm py-sm">
<div class="flex-1 h-px bg-white/10"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant/50 uppercase">Or connect with</span>
<div class="flex-1 h-px bg-white/10"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm">
<button class="btn-social rounded-lg py-sm flex items-center justify-center gap-xs hover:bg-white/10 transition-colors active:scale-95 text-white font-stat-label text-stat-label" type="button">
<span class="material-symbols-outlined text-[20px]">file_download</span>
                    Apple
                </button>
<button class="btn-social rounded-lg py-sm flex items-center justify-center gap-xs hover:bg-white/10 transition-colors active:scale-95 text-white font-stat-label text-stat-label" type="button">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
                    Google
                </button>
</div>
</div>
<!-- Footer link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant/70">
                New pilot? <a class="text-white hover:text-primary transition-colors font-medium" href="#">Create an account</a>
</p>
</div>
</div>
</body></html>
