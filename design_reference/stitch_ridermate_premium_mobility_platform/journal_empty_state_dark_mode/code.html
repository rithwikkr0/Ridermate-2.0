<style>
        /* Custom Level 2 Elevation Shadow for Primary Buttons in Dark Mode */
        .shadow-level-2-orange {
            box-shadow: 0px 12px 32px rgba(255, 107, 0, 0.4);
        }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-background/80 dark:bg-background/80 backdrop-blur-xl border-b border-white/10 shadow-md shadow-primary-container/5">
<button aria-label="Menu" class="text-primary dark:text-primary hover:bg-white/5 transition-colors p-sm rounded-full flex items-center justify-center active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-md text-headline-md tracking-tighter text-primary dark:text-primary font-bold">
            JOURNAL
        </h1>
<button aria-label="User profile" class="w-8 h-8 rounded-full overflow-hidden border border-white/10 hover:border-primary/50 transition-colors">
<img class="w-full h-full object-cover" data-alt="A highly detailed 50-100 word prompt for a user profile avatar. A cinematic, close-up portrait of a rider wearing a high-end matte black motorcycle helmet with a subtly tinted visor reflecting neon city lights. The aesthetic is premium dark mode, with deep charcoal shadows and a vibrant, thin rim light emphasizing the sleek contours of the helmet. The background is a soft, atmospheric blur of a night-time urban environment, conveying a sense of speed and sophisticated technology." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtHVUlVWmZZCgSvKgUg2v0fvF5eFWDIS6P_9_57dBiYFCESU8vdByLieSfMf1JNZI0WuvJM3VRshDIGFJ75WboHRQHZwrbCpM6suM6dW3Pd5tCAt4xZtBZJG6OZoymqDd7fXnj0ekd4oAFqoGXsUcZjxzwrQr5CEOqdqQ11Jv5brJmryQ3ES4ktMQdPXZ4uo4esARxy9nciUdfZW0hhgcNJnwiYiYlSFOxbM3NlOr6qolgiiT47_Ss2w"/>
</button>
</header>
<!-- Main Content Canvas (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pt-24 pb-32 relative z-0">
<!-- Subtle Background Glow / Texture -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-high/40 via-background to-background z-[-1]"></div>
<!-- Illustration Area -->
<div class="w-64 h-64 md:w-80 md:h-80 mb-xl relative rounded-full flex items-center justify-center">
<!-- Soft outer glow for the illustration -->
<div class="absolute inset-0 bg-primary-container/5 blur-3xl rounded-full"></div>
<div class="relative w-full h-full rounded-full overflow-hidden border border-white/5 shadow-2xl shadow-black/50" style="backdrop-filter: blur(12px);">
<img class="w-full h-full object-cover opacity-80 mix-blend-lighten" data-alt="A subtle, high-end digital illustration of a winding, serpentine mountain road slowly disappearing into dense, ethereal mist. The scene is rendered in a minimalist, premium dark mode aesthetic, utilizing deep shades of charcoal and jet black, contrasted by soft, luminous white fog. The road surface has a tactile texture, lit by a cool ambient glow. The mood is mysterious, cinematic, and deeply evocative of solitary, high-performance riding through undiscovered, majestic terrains." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRf3zV-zSZM7MffATzcmn--Eihjj8BIlRI0LeoJrdO9_tiaOn1MJMLn93lefc6tDWSpKSvCpyoIw35ioqH3UUXi_41eNZWCQnHlBEnmI8B0xodM9oGDIr4Rn8Ip830kQNFfjMmUWFgM59t5esjH4zyi-yRtL2znbyX1YssE-FKIqJ8hr-nRCINcthr4cB2w3EexYrmwI80NCp_7gikG80-atjiWJY2YmNU59Es1B-4RIZEmpstvMqgtQ"/>
</div>
</div>
<!-- Typography Cluster -->
<div class="text-center flex flex-col items-center gap-sm mb-xl max-w-md">
<h2 class="font-display-stat text-display-stat text-on-background tracking-tight">
                No Memories Yet
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs opacity-90">
                Your first ride story is waiting. Start a ride and capture the journey.
            </p>
</div>
<!-- Call to Action -->
<button class="bg-primary-container text-on-primary-container font-stat-label text-stat-label px-xl py-lg rounded-full flex items-center gap-sm shadow-level-2-orange hover:bg-[#ff7a1a] transition-all duration-300 active:scale-95 group relative overflow-hidden">
<!-- Subtle top-down gradient overlay for high-gloss finish -->
<div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent opacity-50 pointer-events-none"></div>
<span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1" style="font-variation-settings: 'FILL' 1;">motorcycle</span>
<span class="tracking-widest uppercase relative z-10">GO FOR A RIDE</span>
</button>
</main>
<!-- BottomNavBar (Mobile Shell) -->
<nav class="fixed bottom-margin-mobile left-margin-mobile right-margin-mobile z-50 flex justify-around items-center h-20 px-6 rounded-full bg-surface-container/60 dark:bg-surface-container/60 backdrop-blur-2xl border border-white/10 shadow-xl shadow-black/40 md:hidden">
<!-- Active Tab: Journal -->
<button aria-current="page" class="flex flex-col items-center justify-center text-primary dark:text-primary font-bold scale-110 duration-300 ease-out flex-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">book_5</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Journal</span>
</button>
<!-- Inactive Tab: Photos -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-opacity flex-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">image</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Photos</span>
</button>
<!-- Inactive Tab: Collections -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-opacity flex-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">auto_awesome_motion</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Collections</span>
</button>
<!-- Inactive Tab: Search -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-opacity flex-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">search</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Search</span>
</button>
</nav>
<!-- Desktop Nav Placeholder (Hidden on mobile, follows rule to move nav to top on web. Since TopAppBar already exists, we just hide bottom nav on md+) -->
<!-- The TopAppBar acts as the anchor on desktop in this simplified structure, though a full web app would have more links there. -->
