<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Emergency Tracking</title>

                        "body-md": ["Inter"]

                    fontSize: {

<style>
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(18, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .pulse-ring {
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(2); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Map -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-surface-dim" data-alt="A dark, high-contrast digital map interface showing city streets. The map style is minimalist and technological, featuring deep blacks, dark grays, and subtle grid lines. An intense orange route line cuts through the center. Floating glowing markers indicate points of interest. The aesthetic is reminiscent of a high-end aviation or military tactical display, emphasizing precision and performance." data-location="Los Angeles" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCZ1tMzQvKvackiR2UJYO1Rlam9SmpwF8PbLFUIMmI6R9pbR3WbZ-tf40dhRqQgtq0lWx8dcDucm2H9uA_SghYGImONcL2_rosLZYvW1Ki6rc65nx1hY1nHFTRTWSoW4FUYVoEX4moy78goShrjoPiuzZK7pWVbQympuRlrJzq5Q_RUreudlkCfTxunpVwlN7Hy5U6l47_ZN7jDbEu9piehbw9cntT0W53CYEbY-eLIKvonUNgFd8004A')"></div>
<!-- Pulse Marker -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
<div class="relative flex items-center justify-center">
<div class="absolute w-16 h-16 bg-error rounded-full opacity-30 pulse-ring"></div>
<div class="w-4 h-4 bg-error rounded-full shadow-[0px_0px_12px_rgba(255,180,171,0.8)] z-20"></div>
</div>
</div>
<!-- Hospital Marker -->
<div class="absolute top-1/3 left-1/4 z-10 glass-panel rounded-lg p-2 flex items-center gap-2 shadow-[0px_12px_32px_rgba(255,107,0,0.15)]">
<div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">local_hospital</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface">MERCY GENERAL</p>
<p class="text-[10px] text-tertiary">3 MIN AWAY</p>
</div>
</div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-[30px] border-b border-white/10 shadow-[0px_4px_20px_rgba(0,0,0,0.2)]">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<h1 class="font-label-caps text-label-caps tracking-[0.2em] text-primary dark:text-primary">LIVE TRACKING</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-error hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency</span>
</button>
</div>
</header>
<!-- Main Content Area (Overlay) -->
<main class="relative z-20 flex-1 flex flex-col justify-end p-margin-mobile pt-24 pb-safe gap-gutter pointer-events-none">
<!-- Shared Contacts Pill -->
<div class="self-end glass-panel rounded-full px-4 py-2 flex items-center gap-3 pointer-events-auto shadow-[0px_4px_20px_rgba(0,0,0,0.2)] mb-auto">
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-surface-container border border-white/20 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small, stylized profile portrait of a person wearing a motorcycle helmet, highly contrast lighting, dramatic mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1Xh6MWFhTL85mozUU95fvIeKsMc1Qw-P_jh7aGzz_xa33O94JRIJwkIJYn1RYxAFzSzfUHE7oOZqW1zBI0JYc_LZMe8JGUBD91xEp5wod4HeyaSEhJUT2tVmh1NujG6L2ZpLbVZSnNTar-Bc4x6mx1vjlUu_bu2KefxXBpk-dPfykZ6zZ1RS8RVfERuIp-xy3lh72R3TO-NFhGn_3SWXI-J9-ICfMUlC60Zm2jyfejMlVf4Yc4uJ7jA"/>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container border border-white/20 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small, stylized profile portrait of a person with goggles, sleek technological feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBonRqZ1tcJ5eTECHNlOsqui1Tt0SgsFuZfMPBuJyK11Ils8Zi2bvSnzobTmSinXyOfue-bAwFIMu-CSkrWH7vBnHJ_BckqzpTiitvTBzGNj2_jK4lS90MTekgALtI6ZX-3OZTXIA3uMKRd-dJ2Hckz4OI5K8d_uYUDSmwXej-253K0bwvPfXwW8877M4kjEtNmRaqgYKjqi52uCRCKLVrUqSihvI__e62az3WLi49TL8SoEIenHQpeAg"/>
</div>
</div>
<span class="font-stat-label text-stat-label text-on-surface">Shared with 4 Contacts</span>
</div>
<!-- Emergency Status Card -->
<div class="glass-panel rounded-xl p-6 pointer-events-auto shadow-[0px_12px_32px_rgba(0,0,0,0.4)] w-full max-w-lg mx-auto relative overflow-hidden">
<!-- decorative accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-error"></div>
<div class="flex items-start justify-between mb-6">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Services Dispatched</h2>
<p class="font-body-md text-body-md text-tertiary">Police &amp; EMS en route</p>
</div>
<div class="text-right">
<p class="font-label-caps text-label-caps text-error mb-1">ETA</p>
<p class="font-display-stat text-display-stat text-on-surface">7<span class="font-headline-md text-headline-md text-tertiary">MIN</span></p>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-sm">
<button class="bg-error/10 hover:bg-error/20 border border-error/30 text-error rounded-full py-4 px-6 font-stat-label text-stat-label flex items-center justify-center gap-2 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">phone_in_talk</span>
                    CALL 911
                </button>
<button class="bg-surface-container hover:bg-surface-bright border border-white/10 text-on-surface rounded-full py-4 px-6 font-stat-label text-stat-label flex items-center justify-center gap-2 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">volume_off</span>
                    SILENT MODE
                </button>
</div>
<div class="mt-4">
<button class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-tertiary rounded-full py-3 px-6 font-label-caps text-label-caps tracking-widest transition-colors active:scale-95 duration-200">
                    END EMERGENCY
                </button>
</div>
</div>
</main>
</body></html>
