<script>
        // Simple parallax effect for the cover image
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const coverImage = document.getElementById('coverImage');
            if (scrollY < 300) {
                coverImage.style.transform = `translateY(${scrollY * 0.3}px)`;
            }
        });
