<style>
        .glass-panel {
            background: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 107, 0, 0.05);
        }
        
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.05);
            }
        }
        
        .waveform-bar {
            animation: waveform 1.2s ease-in-out infinite alternate;
            transform-origin: bottom;
        }

        @keyframes waveform {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
        
        /* Staggered animation for waveform bars */
        .wb-1 { animation-delay: 0.1s; }
        .wb-2 { animation-delay: 0.4s; }
        .wb-3 { animation-delay: 0.2s; }
        .wb-4 { animation-delay: 0.6s; }
        .wb-5 { animation-delay: 0.3s; }
        .wb-6 { animation-delay: 0.7s; }
        .wb-7 { animation-delay: 0.2s; }
        .wb-8 { animation-delay: 0.5s; }
        .wb-9 { animation-delay: 0.1s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-md text-body-md select-none">
<!-- Background Map with Frosted Blur overlay -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-40" data-alt="A highly detailed top-down view of a complex winding mountain road map, rendered in a dark mode aesthetic with deep blacks and subtle grey tones. The map features subtle topographical lines and a glowing orange route path. The scene is slightly muted, serving as a background texture for a high-performance riding application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_tQ7EV4VBWOB0ECXWyJz_YbmZgD1G3xioumKTcuWyHgSDilGsGBdqd6m1YTFiwpYaAIvi8qCo1IxkxI0jUlOYunW7mXckKvX0ATuXgABwaUCYSzl7llJIGsnC1XYf65rirM-wBgyOfaP1qnfZrrhNzRj4WIA7p2R0CVtmgga-DYVrxwYEEXjy8DHI5aY4wRcmUx5XALQ7UUsPehSZIlQAUqFipd5m44Kd0wyUq4dYb1OQoGxUMhAmRQ"/>
<div class="absolute inset-0 bg-background/80 backdrop-blur-md"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-background/80 dark:bg-background/80 backdrop-blur-xl border-b border-white/10 shadow-md shadow-primary-container/5">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-white/5 transition-colors text-primary dark:text-primary active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg tracking-tighter text-primary dark:text-primary">JOURNAL NOTES</h1>
<div class="flex items-center justify-center p-1 rounded-full border border-white/10 w-10 h-10 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A high-quality, professional profile picture of a motorcyclist wearing a sleek, modern matte black helmet with a tinted visor. The lighting is dramatic, highlighting the contours of the helmet against a dark background, fitting the high-end kinetic precision aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHi-SyQQXmZx2C73P0PaCPnqlyXkEBy4JOanjSTZqukyDsW-25v-1nYFD_qqaGh2_M5IFQyTyOWX8VBf8xxvSw6q1_NYetDuDY9d7OAWyHPBh1ls1EEL5aKU9WrpAKdBPSbDGW_qNSsCCQLEzRhzPNOnYCGb2UlMa8s0Iw4fWSyrYKXkmQ7xoV4n8B7ix-kl_5dVuRMzKFHPdnW3WxgSxOYNm1TdYx-LFbiJkZxDCIYBZH9iV8B-uVyw"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen pt-16 pb-32 px-margin-mobile">
<!-- Status Text -->
<div class="mb-8 flex flex-col items-center">
<div class="flex items-center gap-2 mb-2">
<div class="w-3 h-3 rounded-full bg-error animate-pulse"></div>
<span class="font-label-caps text-label-caps text-error tracking-widest uppercase">Recording...</span>
</div>
</div>
<!-- Timer -->
<div class="mb-16">
<h2 class="font-display-stat text-display-stat text-on-surface tracking-tighter">00:45</h2>
</div>
<!-- Animated Waveform -->
<div class="flex items-end justify-center gap-1 md:gap-2 h-32 mb-24 w-full max-w-sm px-4">
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-1 h-1/4"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-2 h-2/4"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-3 h-3/4"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-4 h-full pulse-ring shadow-[0_0_15px_rgba(255,107,0,0.6)]"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-5 h-2/3"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-6 h-5/6"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-7 h-1/2"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-8 h-3/4"></div>
<div class="w-2 md:w-3 bg-primary-container rounded-t-full waveform-bar wb-9 h-1/3"></div>
</div>
<!-- Controls -->
<div class="flex items-center justify-center gap-8 w-full max-w-xs">
<!-- Delete Button -->
<button class="glass-panel flex items-center justify-center w-16 h-16 rounded-full hover:bg-white/10 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-error transition-colors" style="font-variation-settings: 'FILL' 0;">delete</span>
</button>
<!-- Stop Button (Primary Action) -->
<button class="bg-primary-container text-on-primary-container flex items-center justify-center w-20 h-20 rounded-full shadow-[0_12px_32px_rgba(255,107,0,0.4)] active:scale-95 transition-transform duration-200 hover:brightness-110">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
<!-- Placeholder for balance, could be a pause button later -->
<div class="w-16 h-16"></div>
</div>
</main>
</body></html>
