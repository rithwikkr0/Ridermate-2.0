<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate Navigation Map Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Map glow animation */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 16px rgba(255, 107, 0, 0.9)); }
        }
        .route-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#572000",
                    "primary": "#ffb693",
                    "inverse-on-surface": "#2f3131",
                    "on-secondary-fixed-variant": "#474646",
                    "error": "#ffb4ab",
                    "surface-bright": "#37393a",
                    "tertiary-container": "#9a9999",
                    "outline": "#a98a7d",
                    "tertiary-fixed-dim": "#c8c6c5",
                    "primary-fixed-dim": "#ffb693",
                    "on-error": "#690005",
                    "inverse-surface": "#e2e2e2",
                    "on-surface": "#e2e2e2",
                    "surface-container-low": "#1a1c1c",
                    "on-primary-fixed-variant": "#7a3000",
                    "inverse-primary": "#a04100",
                    "on-error-container": "#ffdad6",
                    "on-background": "#e2e2e2",
                    "surface-tint": "#ffb693",
                    "primary-container": "#ff6b00",
                    "error-container": "#93000a",
                    "on-surface-variant": "#e2bfb0",
                    "on-primary": "#561f00",
                    "surface": "#121414",
                    "surface-container-lowest": "#0c0f0f",
                    "on-tertiary": "#303030",
                    "surface-variant": "#333535",
                    "primary-fixed": "#ffdbcc",
                    "secondary-fixed-dim": "#c8c6c5",
                    "secondary": "#c8c6c5",
                    "surface-container-highest": "#333535",
                    "surface-dim": "#121414",
                    "on-tertiary-container": "#313131",
                    "on-secondary-fixed": "#1c1b1b",
                    "on-primary-fixed": "#351000",
                    "secondary-container": "#4a4949",
                    "tertiary": "#c8c6c5",
                    "surface-container-high": "#282a2b",
                    "secondary-fixed": "#e5e2e1",
                    "on-tertiary-fixed": "#1b1c1c",
                    "on-secondary": "#313030",
                    "on-tertiary-fixed-variant": "#474746",
                    "tertiary-fixed": "#e4e2e1",
                    "surface-container": "#1e2020",
                    "outline-variant": "#5a4136",
                    "background": "#121414",
                    "on-secondary-container": "#bab8b7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "xl": "32px",
                    "md": "16px",
                    "unit": "4px",
                    "sm": "8px",
                    "lg": "24px",
                    "gutter": "16px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-md": [
                            "Hanken Grotesk"
                    ],
                    "stat-label": [
                            "Inter"
                    ],
                    "display-stat": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg": [
                            "Hanken Grotesk"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "label-caps": [
                            "JetBrains Mono"
                    ],
                    "body-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "600"
                            }
                    ],
                    "stat-label": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-stat": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "label-caps": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- LEVEL 0: Map Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A high-contrast, dark mode topographical street map interface from a luxury GPS application. Deep blacks and charcoal grays dominate the landscape, with subtle lighter gray lines indicating secondary roads. The aesthetic is highly technical, minimalist, and designed for nighttime visibility in a vehicle cockpit, emitting a very faint, cool glow from major arteries." data-location="Los Angeles" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA-K63WOthBFfYc8_arkTPSarzGtYUhnt7xNBHE7Ako60qZgmbuJWVUXBliXYlAZ3aC38A0PxaRX9gjJS1eh0E525m6mg7_TtcNLAn40Tl6x4-qNoLCXSWe9ksb1e3f6musJ7s5aAMzzJw6jmgP8bqajkyurtxx_VWeT3aWB0xzm6G60u77NgOWV8Z-jt0rRVeoimA89c-_rMNuXSIJZ1Y_0qXHRkfA7OTZoIHxxJefyyW5ftzlVXjBQg')"></div>
<!-- Active Route Line (Simulated via SVG) -->
<svg class="absolute inset-0 z-0 pointer-events-none w-full h-full" preserveaspectratio="xMidYMid slice" viewbox="0 0 1000 1000">
<path class="route-glow shadow-[0_0_12px_rgba(255,107,0,0.8)]" d="M 500,400 Q 600,500 450,700 T 300,900" fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<circle class="shadow-lg" cx="500" cy="400" fill="#e2e2e2" r="10" stroke="#121414" stroke-width="4"></circle>
<!-- Current Position Marker -->
<circle class="shadow-[0_0_16px_rgba(255,107,0,1)]" cx="300" cy="900" fill="#ff6b00" r="12" stroke="#121414" stroke-width="4"></circle>
</svg>
<!-- LEVEL 2: Floating Search Bar -->
<div class="absolute top-12 left-margin-mobile right-margin-mobile z-20 flex items-center bg-surface/60 backdrop-blur-[20px] border border-white/10 rounded-full px-4 py-3 shadow-[0_12px_32px_rgba(255,107,0,0.05)] hover:bg-surface/80 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-3">search</span>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder-on-surface-variant/70 p-0" placeholder="Where to?" type="text"/>
<button class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center ml-2 border border-white/5 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface text-sm">mic</span>
</button>
</div>
<!-- LEVEL 2: Floating Map Controls -->
<div class="absolute top-32 right-margin-mobile z-20 flex flex-col gap-3">
<button class="w-[48px] h-[48px] rounded-full bg-surface/60 backdrop-blur-[20px] border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.05)] flex items-center justify-center text-on-surface hover:bg-surface/80 active:scale-95 transition-all group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">my_location</span>
</button>
<button class="w-[48px] h-[48px] rounded-full bg-surface/60 backdrop-blur-[20px] border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.05)] flex items-center justify-center text-on-surface hover:bg-surface/80 active:scale-95 transition-all group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">3d_rotation</span>
</button>
<button class="w-[48px] h-[48px] rounded-full bg-surface/60 backdrop-blur-[20px] border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.05)] flex items-center justify-center text-on-surface hover:bg-surface/80 active:scale-95 transition-all group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors">layers</span>
</button>
</div>
<!-- LEVEL 1: Bottom Sheet (Collapsed peeking state) -->
<!-- Positioned just above the Bottom Nav Bar -->
<div class="absolute bottom-[88px] left-margin-mobile right-margin-mobile z-30 bg-surface/80 backdrop-blur-[20px] border border-white/10 rounded-t-[32px] rounded-b-xl shadow-[0_-8px_32px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
<!-- Drag Handle Area -->
<div class="w-full pt-4 pb-2 flex justify-center items-center cursor-pointer">
<div class="w-12 h-1.5 bg-on-surface-variant/30 rounded-full"></div>
</div>
<div class="px-5 pb-6">
<!-- Route Preview Header -->
<div class="flex justify-between items-end mb-4">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Route Preview</h2>
<p class="font-body-md text-body-md text-primary-container">45 mins <span class="text-on-surface-variant mx-1">•</span> 32 km</p>
</div>
<button class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center shadow-[0_4px_16px_rgba(255,107,0,0.3)] active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-primary-container">directions</span>
</button>
</div>
<!-- Favorite Places Chips -->
<div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide -mx-5 px-5">
<button class="flex-shrink-0 flex items-center gap-2 bg-surface-container border border-white/5 rounded-full px-4 py-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-[18px]">home</span>
<span class="font-label-caps text-label-caps text-on-surface">HOME</span>
</button>
<button class="flex-shrink-0 flex items-center gap-2 bg-surface-container border border-white/5 rounded-full px-4 py-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-[18px]">work</span>
<span class="font-label-caps text-label-caps text-on-surface">WORK</span>
</button>
<button class="flex-shrink-0 flex items-center gap-2 bg-surface-container border border-white/5 rounded-full px-4 py-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-[18px]">local_cafe</span>
<span class="font-label-caps text-label-caps text-on-surface">CAFE</span>
</button>
</div>
</div>
</div>
<!-- LEVEL 2: BottomNavBar Shared Component -->
<!-- Semantic Active Match: "Nav" represents the map/exploration screen -->
<nav class="fixed bottom-4 left-margin-mobile right-margin-mobile rounded-full border border-white/10 shadow-[0_12px_32px_rgba(255,107,0,0.4)] fixed bottom-4 left-margin-mobile right-margin-mobile z-50 flex justify-around items-center py-sm bg-surface-container/60 dark:bg-surface-container/60 backdrop-blur-[30px]">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<!-- Nav (ACTIVE) -->
<a class="flex flex-col items-center justify-center text-primary font-bold bg-primary/10 rounded-full px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined icon-fill">explore</span>
<span class="font-label-caps text-label-caps mt-1 text-primary">Nav</span>
</a>
<!-- Coach -->
<a class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">psychology</span>
<span class="font-label-caps text-label-caps mt-1">Coach</span>
</a>
<!-- Stats -->
<a class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">insights</span>
<span class="font-label-caps text-label-caps mt-1">Stats</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-secondary-container/60 px-4 py-2 hover:bg-white/5 transition-colors active:scale-95 transition-all duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a>
</nav>
</body></html>
