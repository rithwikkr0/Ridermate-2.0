<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiderMate - Pre-Ride AI Briefing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#5a4136",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#313131",
                        "on-secondary-container": "#bab8b7",
                        "secondary": "#c8c6c5",
                        "surface-dim": "#121414",
                        "on-tertiary-fixed-variant": "#474746",
                        "secondary-fixed": "#e5e2e1",
                        "on-background": "#e2e2e2",
                        "on-primary-fixed": "#351000",
                        "background": "#121414",
                        "secondary-container": "#4a4949",
                        "surface-container-highest": "#333535",
                        "surface-variant": "#333535",
                        "inverse-primary": "#a04100",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed": "#1c1b1b",
                        "error-container": "#93000a",
                        "tertiary-container": "#9a9999",
                        "surface-container-lowest": "#0c0f0f",
                        "surface": "#121414",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-bright": "#37393a",
                        "on-tertiary": "#303030",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary": "#313030",
                        "on-error": "#690005",
                        "surface-container-low": "#1a1c1c",
                        "surface-tint": "#ffb693",
                        "primary": "#ffb693",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary": "#c8c6c5",
                        "surface-container-high": "#282a2b",
                        "outline": "#a98a7d",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#e2bfb0",
                        "tertiary-fixed": "#e4e2e1",
                        "on-primary-fixed-variant": "#7a3000",
                        "primary-fixed": "#ffdbcc",
                        "primary-container": "#ff6b00",
                        "on-primary-container": "#572000",
                        "on-tertiary-fixed": "#1b1c1c",
                        "primary-fixed-dim": "#ffb693",
                        "inverse-on-surface": "#2f3131",
                        "on-primary": "#561f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px",
                        "unit": "4px",
                        "xl": "32px",
                        "gutter": "16px",
                        "xs": "4px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "display-stat": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "stat-label": ["Inter"]
                    },
                    "fontSize": {
                        "display-stat": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(30, 32, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary-gradient {
            background: linear-gradient(180deg, #ff8c33 0%, #ff6b00 100%);
            box-shadow: 0px 4px 14px rgba(255, 107, 0, 0.3), inset 0px 1px 0px rgba(255, 255, 255, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden selection:bg-primary-container selection:text-white">
<!-- Background Map Layer -->
<div class="fixed inset-0 z-0 opacity-40">
<img alt="Background Map" class="w-full h-full object-cover filter grayscale contrast-125" data-alt="A dark, high-contrast digital map interface showing a complex city grid. The aesthetic is sleek, minimalist, and technical, resembling a high-performance navigation system. Subtle glowing orange route lines trace paths through the dark grey and black streets. The overall mood is focused and ready for a ride, fitting a premium ride-tracking application." data-location="Los Angeles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrWLQVE2x98TT64iASbT8fDehfJS0bifPphXxiYzPCTCdXhw-ZYirexxWQqdU5Dse4zhocpArljoF4iLRqEPAdIof6XuhxU1sEDe5s33wHAXsDgtR9T4f4TAuhDNgp2U6OaOj7CK01FJE2eg3ySqs42ofL1ROVDWDQVir3EOsBOnclj0Am5Wqx4gZYRAnpAkzze-El6YciYnJZTg3j2f1WJpBwRqi8cla9LXcGy4SjJTwIX5BiEOBNUw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 px-margin-mobile pt-12 pb-32 max-w-lg mx-auto min-h-screen flex flex-col">
<!-- Header -->
<header class="mb-lg flex items-center justify-between">
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Pre-Ride Briefing</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Destination Overview Card -->
<section class="glass-panel rounded-xl p-md mb-gutter shadow-[0_4px_20px_rgba(0,0,0,0.2)]">
<div class="flex justify-between items-start mb-sm">
<div>
<h2 class="font-stat-label text-stat-label text-secondary uppercase tracking-wider mb-xs">Destination Overview</h2>
<p class="font-headline-md text-headline-md text-on-surface">Pacific Coast Highway</p>
</div>
<div class="bg-primary/20 border border-primary/30 rounded-full px-3 py-1 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-label-caps text-label-caps text-primary">ETA 45M</span>
</div>
</div>
<div class="relative h-32 rounded-lg overflow-hidden border border-white/5 mt-md">
<img alt="Route Map Snippet" class="w-full h-full object-cover" data-alt="A zoomed-in, stylized snippet of a dark mode map showing a specific winding route along a coastline. The route is highlighted in a vibrant, glowing circuit orange (#ff6b00) against dark slate and black terrain. The aesthetic is ultra-modern, crisp, and high-tech, communicating precision and performance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKpdhnuupSSVSZEVTek5fXWvsum3nmrkMNt2RTNhFv7folOPGZUJKJeMmdI8h4_demzA_oiUNqYh-W0reOstUfKdWwRfJeabyUAPZmQT1fGp7MZfBLhdSKdhYO5U3cZgOxifpT-HcENYwqQyzDN44ng6BT8WKjnO_0rXIcFaLGffJMNzT6pAIlB9T53dsZFJ-SEZuFMQfP1ARHyu-KAyWuigJZvultIHgYGlKqEVURKetxYOr_a8Q_tg"/>
<!-- Route Overlay Indicator -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center animate-pulse">
<div class="w-3 h-3 rounded-full bg-primary shadow-[0_0_10px_#ff6b00]"></div>
</div>
</div>
</div>
</section>
<!-- Smart Conditions Grid -->
<section class="grid gap-gutter mb-xl flex-grow">
<!-- Weather -->
<div class="glass-panel rounded-xl p-md flex items-start gap-md">
<div class="w-12 h-12 rounded-full bg-surface-bright flex items-center justify-center shrink-0 border border-white/5">
<span class="material-symbols-outlined text-secondary text-2xl">partly_cloudy_day</span>
</div>
<div>
<h3 class="font-stat-label text-stat-label text-secondary uppercase tracking-wider mb-xs">Weather</h3>
<p class="font-body-md text-body-md text-on-surface font-medium">22°C Clear. Rain likely at 15:00.</p>
</div>
</div>
<!-- Traffic -->
<div class="glass-panel rounded-xl p-md flex items-start gap-md">
<div class="w-12 h-12 rounded-full bg-surface-bright flex items-center justify-center shrink-0 border border-white/5">
<span class="material-symbols-outlined text-primary-fixed-dim text-2xl">traffic</span>
</div>
<div>
<h3 class="font-stat-label text-stat-label text-secondary uppercase tracking-wider mb-xs">Traffic</h3>
<p class="font-body-md text-body-md text-on-surface font-medium">Normal. Avoid 405 Highway.</p>
</div>
</div>
<!-- Safety -->
<div class="glass-panel rounded-xl p-md flex items-start gap-md border-l-2 border-l-error">
<div class="w-12 h-12 rounded-full bg-error-container/20 flex items-center justify-center shrink-0 border border-error/20">
<span class="material-symbols-outlined text-error text-2xl" style="font-variation-settings: 'FILL' 1;">tire_repair</span>
</div>
<div>
<h3 class="font-stat-label text-stat-label text-error uppercase tracking-wider mb-xs">Safety Alert</h3>
<p class="font-body-md text-body-md text-on-surface font-medium">Check tire pressure. 32 PSI recommended.</p>
</div>
</div>
</section>
<!-- Primary Action (Fixed to bottom above safe area) -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pb-8 z-20 flex justify-center">
<button class="w-full max-w-lg btn-primary-gradient rounded-full py-4 px-6 flex items-center justify-center gap-2 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">power_settings_new</span>
<span class="font-headline-md text-[20px] font-bold text-white tracking-wide">START PROTECTED RIDE</span>
</button>
</div>
</main>
</body></html>
