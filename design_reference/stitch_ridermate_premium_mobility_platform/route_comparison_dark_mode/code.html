<style>
        .glass-panel {
            background-color: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .route-glow {
            filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden relative">
<!-- Map Background -->
<div class="absolute inset-0 w-full h-full z-0" data-alt="A dark, high-contrast satellite view map of a mountainous region, styled with a deep charcoal and obsidian color palette. The map features minimal terrain details in subtle greys, creating a sleek, premium minimalist aesthetic. The lighting is subdued, emphasizing a high-performance, dark-mode navigation interface." data-location="Swiss Alps" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDdVag04lr-q2C4x26aDNgXFo_U2K3Ln3bQjgG4sjv4W5vYOE4ydPWJd1NEiw6LoB10upZubeDfHCUMiKOlIKC5c1ujHCQxtS29KA4lekaUTfrfYFMBcC22TU8Ab_OX-4y0N4aE5GJmqHaZg93-ss0l7XTrosSeSrM7dR8M1HyL8n0VU61mBxRoha-gTv-nRPR42OTbvhE7BC5Fl3qsKV2OodquY5zPwJv_rGhq767ToO5q3R5sOPc74Q')">
<!-- SVG Polylines for Routes -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 100 100">
<!-- Scenic Route (Faded) -->
<path d="M 10 90 Q 30 70, 50 60 T 90 20" fill="none" stroke="rgba(200, 198, 197, 0.3)" stroke-dasharray="2,1" stroke-width="0.5"></path>
<!-- Balanced Route (Faded) -->
<path d="M 10 90 C 20 50, 60 50, 90 20" fill="none" stroke="rgba(255, 182, 147, 0.4)" stroke-width="0.8"></path>
<!-- Fastest Route (Active) -->
<path class="route-glow" d="M 10 90 L 50 50 L 90 20" fill="none" stroke="#ff6b00" stroke-width="1.5"></path>
<!-- Start/End Markers -->
<circle cx="10" cy="90" fill="#e2e2e2" r="2"></circle>
<circle cx="90" cy="20" fill="#ff6b00" r="2"></circle>
</svg>
</div>
<!-- Top App Bar (From JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface/60 backdrop-blur-3xl border-b border-white/10 shadow-sm flex justify-between items-center px-margin-mobile py-md">
<!-- Leading Action (Back instead of avatar for transactional flow) -->
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high/50 hover:opacity-80 transition-opacity scale-95 active:scale-90 text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary">RiderMate</h1>
<div class="w-10 h-10 flex items-center justify-center rounded-full glass-panel text-on-surface hover:opacity-80 transition-opacity scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</div>
</header>
<!-- Bottom Sheet for Route Details -->
<div class="fixed bottom-0 left-0 w-full z-40">
<div class="glass-panel rounded-t-[32px] pt-sm pb-8 px-margin-mobile shadow-level-1 transform transition-transform duration-300">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-lg"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Select Route</h2>
<!-- Route Toggle Carousel -->
<div class="flex space-x-md overflow-x-auto pb-sm snap-x snap-mandatory hide-scrollbar">
<!-- Option 1: Fastest (Active) -->
<div class="flex-shrink-0 w-64 glass-panel rounded-xl p-md border-primary-container snap-center relative overflow-hidden" style="border-color: rgba(255,107,0,0.5);">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary-container/20 rounded-bl-full blur-xl"></div>
<div class="flex justify-between items-start mb-sm relative z-10">
<div>
<span class="font-label-caps text-label-caps text-primary">FASTEST</span>
<h3 class="font-stat-label text-stat-label text-on-surface mt-xs">Valley Sprint</h3>
</div>
<span class="material-symbols-outlined text-primary" data-icon="bolt">bolt</span>
</div>
<div class="grid grid-cols-2 gap-sm mt-md relative z-10">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">TIME</p>
<p class="font-headline-md text-headline-md text-on-surface">1h 12m</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">DISTANCE</p>
<p class="font-headline-md text-headline-md text-on-surface">32.4 <span class="text-sm font-normal text-on-surface-variant">km</span></p>
</div>
<div class="col-span-2">
<p class="font-label-caps text-label-caps text-on-surface-variant">ELEVATION</p>
<p class="font-stat-label text-stat-label text-on-surface">+450m</p>
</div>
</div>
</div>
<!-- Option 2: Scenic -->
<div class="flex-shrink-0 w-64 bg-surface-container/40 rounded-xl p-md border border-white/5 snap-center">
<div class="flex justify-between items-start mb-sm">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant">SCENIC</span>
<h3 class="font-stat-label text-stat-label text-on-surface mt-xs">Ridge Loop</h3>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="landscape">landscape</span>
</div>
<div class="grid grid-cols-2 gap-sm mt-md opacity-70">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">TIME</p>
<p class="font-stat-label text-stat-label text-on-surface">1h 45m</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">DISTANCE</p>
<p class="font-stat-label text-stat-label text-on-surface">38.2 <span class="text-xs font-normal">km</span></p>
</div>
<div class="col-span-2">
<p class="font-label-caps text-label-caps text-on-surface-variant">ELEVATION</p>
<p class="font-stat-label text-stat-label text-on-surface">+820m</p>
</div>
</div>
</div>
<!-- Option 3: Balanced -->
<div class="flex-shrink-0 w-64 bg-surface-container/40 rounded-xl p-md border border-white/5 snap-center">
<div class="flex justify-between items-start mb-sm">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant">BALANCED</span>
<h3 class="font-stat-label text-stat-label text-on-surface mt-xs">Forest Run</h3>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="balance">balance</span>
</div>
<div class="grid grid-cols-2 gap-sm mt-md opacity-70">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">TIME</p>
<p class="font-stat-label text-stat-label text-on-surface">1h 25m</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">DISTANCE</p>
<p class="font-stat-label text-stat-label text-on-surface">35.0 <span class="text-xs font-normal">km</span></p>
</div>
<div class="col-span-2">
<p class="font-label-caps text-label-caps text-on-surface-variant">ELEVATION</p>
<p class="font-stat-label text-stat-label text-on-surface">+600m</p>
</div>
</div>
</div>
</div>

<button class="w-full mt-lg bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-full shadow-level-2 hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm bg-gradient-to-b from-primary-container to-[#cc5500]">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                START RIDE
            </button>
</div>
</div>
